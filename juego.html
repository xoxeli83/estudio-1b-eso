function pickVar(base){
  const vs=VAR[String(base.id)];
  if(!vs||!vs.length)return base;
  const i=Math.floor(Math.random()*(vs.length+1));
  if(i===vs.length)return base;
  const c=vs[i];
  return {id:base.id,b:base.b,c:base.c,n:base.n,q:c[0],a:c[1],w:c.slice(2)};
}

function rng32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function dueloPreguntas(seed){
  const r=rng32(seed),ids=Object.keys(VAR).filter(k=>/^\d+$/.test(k)&&VAR[k].every(v=>v.length>=5));
  const out=[];
  while(out.length<5){const id=ids[Math.floor(r()*ids.length)];if(out.some(x=>x.id===id))continue;
    const v=VAR[id][Math.floor(r()*VAR[id].length)],opts=[v[1],v[2],v[3],v[4]];
    for(let i=3;i>0;i--){const j=Math.floor(r()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
    out.push({id,q:v[0],a:v[1],opts});}
  return out;
}
function openLeague(onClose){
  const o=document.createElement('div');o.id='lg';document.body.appendChild(o);
  let tab='estudio',data=null;
  const close=()=>{o.remove();onClose&&onClose();};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const showErr=(id,m)=>{const e=o.querySelector('#'+id);if(e)e.textContent=m;};
  function join(){
    o.innerHTML=`<div class="lg-box"><button class="lg-x" id="lg-x">Volver</button><h2>Únete a tu grupo</h2>
      <label class="lg-l">Código del grupo<input id="lg-c" autocomplete="off" maxlength="40"></label>
      <label class="lg-l">Tu apodo<input id="lg-a" autocomplete="off" maxlength="14"></label>
      <p class="lg-s">Usa un apodo inventado, nunca tu nombre real.</p>
      <label class="lg-ck"><input type="checkbox" id="lg-p"> Mi padre, madre o tutor me ha dado permiso.</label>
      <div class="lg-err" id="lg-e" role="alert"></div><button class="lg-go" id="lg-j">Entrar</button></div>`;
    o.querySelector('#lg-x').onclick=close;
    o.querySelector('#lg-j').onclick=async()=>{
      if(!o.querySelector('#lg-p').checked)return showErr('lg-e','Antes necesitas el permiso de tu padre, madre o tutor.');
      try{const g=gLoad();const r=await ligaRpc('unirse',{p_codigo:o.querySelector('#lg-c').value.trim(),p_apodo:o.querySelector('#lg-a').value,p_avatar:g.av});
        const g2=gLoad();g2.liga={token:r.token,id:r.id,apodo:r.apodo};gSave(g2);await ligaSync();load();}catch(e){showErr('lg-e',e.message);}
    };
  }
  async function load(){
    o.innerHTML='<div class="lg-box"><p>Cargando…</p></div>';
    const g=gLoad();
    try{await ligaSync();await ligaSubirJuego();data=await ligaRpc('clasificacion',{p_token:g.liga.token});main();}
    catch(e){
      if(/no encontrado/.test(e.message)){delete g.liga;gSave(g);return join();}
      o.innerHTML=`<div class="lg-box"><h2>Ahora no hay conexión</h2><p>${esc(e.message)}</p><button class="lg-go" id="lg-x">Volver</button></div>`;o.querySelector('#lg-x').onclick=close;}
  }
  const COLS={estudio:['Estudio',x=>x.estudio,x=>x.estudio+' %'],estrellas:['Estrellas',x=>x.estrellas,x=>'⭐ '+x.estrellas],juego:['Juego',x=>x.juego,x=>'🎮 '+(x.juego||0)],simulacro:['Simulacro',x=>x.simulacro,x=>x.simulacro==null?'–':x.simulacro+' de 50'],mejora:['Mejora',x=>x.mejora,x=>x.mejora==null?'–':'+'+x.mejora],racha:['Días seguidos',x=>x.racha,x=>x.racha+(x.racha===1?' día':' días')]};
  function main(){
    const me=data.jugadores.find(x=>x.id===data.yo);
    const trof=id=>data.trofeos.filter(t=>t.dueno===id).map(t=>t.trofeo);
    const c=COLS[tab];
    const rows=[...data.jugadores].sort((a,b)=>(c[1](b)??-1)-(c[1](a)??-1));
    let pos=0,prev=null;
    const list=rows.map((x,i)=>{const v=c[1](x)??-1;if(v!==prev){pos=i+1;prev=v;}
      return `<div class="lg-row ${x.id===data.yo?'me':''}"><span class="lg-pos">${pos}</span>${avatarConTrofeos(Object.assign(gDef().av,x.avatar),38,trof(x.id))}<span class="lg-name">${esc(x.apodo)} ${trof(x.id).map(t=>TROFEOS[t].e).join('')}</span><b>${c[2](x)}</b></div>`;}).join('');
    const nameOf=id=>{const j=data.jugadores.find(x=>x.id===id);return j?j.apodo:null;};
    const cards=['corona','capa','rayo'].map(k=>{const t=data.trofeos.find(x=>x.trofeo===k);const own=t&&t.dueno===data.yo;const who=t&&nameOf(t.dueno);
      return `<div class="lg-t"><div class="lg-te">${TROFEOS[k].e}</div><b>${TROFEOS[k].n}</b><span class="lg-s">${own?'¡Es tuyo!':who?esc(who):'Sin dueño'}</span>${own?'':`<button class="lg-mini" data-r="${k}">${who?'Retar':'Conseguir'}</button>`}</div>`;}).join('');
    const retos=data.retos.map(r=>`<div class="lg-reto"><span>${TROFEOS[r.trofeo].e} <b>${esc(r.retador)}</b> te reta por tu ${TROFEOS[r.trofeo].n.toLowerCase()}. Tienes 48 horas.</span><button class="lg-mini" data-d="${r.id}">Defender</button></div>`).join('');
    o.innerHTML=`<div class="lg-box"><div class="lg-top"><button class="lg-x" id="lg-x">Volver</button><div class="lg-me">${avatarConTrofeos(gLoad().av,44,trof(data.yo))}<div><b>${esc(me.apodo)}</b><div class="lg-s">Has estudiado el ${me.estudio} %</div></div></div></div>
      ${retos}<h3>Trofeos</h3><p class="lg-s">Se ganan en duelos de 5 preguntas. Lo que has ganado con estrellas nunca se pierde.</p><div class="lg-ts">${cards}</div><div class="lg-err" id="lg-e" role="alert"></div>
      <h3>Clasificación</h3><div class="lg-tabs">${Object.keys(COLS).map(k=>`<button class="${k===tab?'on':''}" data-k="${k}">${COLS[k][0]}</button>`).join('')}</div>${tab==='estudio'?'<p class="lg-s">Si todos estudiáis todo, todos llegáis al 100 %.</p>':''}${list}
      <button class="lg-del" id="lg-del">Borrar mi perfil</button></div>`;
    o.querySelector('#lg-x').onclick=close;
    o.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{tab=b.dataset.k;main();});
    o.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{try{const t=gLoad().liga.token;const r=await ligaRpc('retar',{p_token:t,p_trofeo:b.dataset.r});play(r.semilla,async p=>{const x=await ligaRpc('enviar_reto',{p_token:t,p_duelo:r.id,p_pts:p});return x.resultado==='ganado'?`¡${p} de 5! El trofeo es tuyo.`:x.resultado==='no_llega'?`${p} de 5. Hacen falta 3 aciertos para conseguirlo.`:`${p} de 5. Ahora le toca responder a tu rival.`;});}catch(e){showErr('lg-e',e.message);}});
    o.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const r=data.retos.find(x=>x.id===b.dataset.d),t=gLoad().liga.token;play(r.semilla,async p=>{const x=await ligaRpc('enviar_defensa',{p_token:t,p_duelo:r.id,p_pts:p});return x.gane?`Has defendido el trofeo: ${x.def} a ${x.ret}.`:`Esta vez lo pierdes: ${x.def} a ${x.ret}. Puedes retarle para recuperarlo.`;});});
    const del=o.querySelector('#lg-del');let armed=false;
    del.onclick=async()=>{if(!armed){armed=true;del.textContent='Pulsa otra vez para borrarlo';return;}
      try{await ligaRpc('borrar_perfil',{p_token:gLoad().liga.token});}catch(e){}const g=gLoad();delete g.liga;gSave(g);close();};
  }
  function play(seed,finish){
    const qs=dueloPreguntas(seed);let i=0,pts=0;
    const next=()=>{
      if(i>=qs.length)return end();
      const q=qs[i];
      o.innerHTML=`<div class="lg-box"><p class="lg-s">Duelo: pregunta ${i+1} de 5</p><div class="lg-q">${gB(q.q)}</div>${q.opts.map((t,k)=>`<button class="lg-opt" data-o="${k}">${esc(t)}</button>`).join('')}</div>`;
      o.querySelectorAll('.lg-opt').forEach(b=>b.onclick=()=>{const t=q.opts[+b.dataset.o],ok=t===q.a;if(ok)pts++;
        o.querySelectorAll('.lg-opt').forEach((x,k)=>{x.disabled=true;if(q.opts[k]===q.a)x.classList.add('ok');else if(x===b)x.classList.add('no');});
        i++;setTimeout(next,900);});
    };
    const end=async()=>{let m;try{m=await finish(pts);}catch(e){m=e.message;}
      gAward(2);o.innerHTML=`<div class="lg-box lg-end"><h2>${esc(m)}</h2><button class="lg-go" id="lg-b">Ver la clasificación</button></div>`;o.querySelector('#lg-b').onclick=load;};
    next();
  }
  if(gLoad().liga)load();else join();
}

/* ===== Juego tipo dinosaurio: el muñeco corre y salta. Las partidas se pagan con fichas ganadas estudiando ===== */
function openGame(onClose){
  const o=document.createElement('div');o.id='jg';document.body.appendChild(o);
  let raf=null,st=null,img=null;
  const W=innerWidth<600?480:800,H=260,GROUND=222;
  const close=()=>{cancelAnimationFrame(raf);removeEventListener('keydown',kd);removeEventListener('keyup',ku);o.remove();onClose&&onClose();};
  const OBS=[{e:'🐛',w:36,h:28,fs:34,air:false},{e:'🧱',w:30,h:34,fs:36,air:false},{e:'🧱🧱',w:62,h:34,fs:36,air:false},{e:'📦',w:38,h:40,fs:42,air:false},{e:'👾',w:38,h:30,fs:36,air:true}];
  function menu(){
    const g=gLoad();
    cancelAnimationFrame(raf);st=null;
    o.innerHTML=`<div class="jg-box"><button class="lg-x" id="jg-x">Volver</button><h2>Salta y corre</h2>
      <div class="jg-hero">${avatarSVG(g.av,90)}<div><div class="av-st">🎮 ${g.fichas} ${g.fichas===1?'ficha':'fichas'}</div><div class="av-next">Tu récord: ${g.juegoBest}</div></div></div>
      <p>Salta con <kbd class="jg-k">espacio</kbd> o tocando la pantalla. Cuanto más mantengas, más alto saltas.</p>
      ${g.fichas>0?'<button class="lg-go" id="jg-go">Jugar (1 ficha)</button>':'<div class="jg-empty"><b>Te has quedado sin fichas.</b><br>Cada misión terminada te da 2 fichas, y cada simulacro también.</div>'}</div>`;
    o.querySelector('#jg-x').onclick=close;
    const b=o.querySelector('#jg-go');if(b){b.onclick=start;b.focus({preventScroll:true});}
  }
  function start(){
    const g=gLoad();if(g.fichas<=0)return menu();
    g.fichas--;gSave(g);
    o.innerHTML=`<div class="jg-box"><div class="jg-score"><span id="jg-s">0</span><span class="jg-best">Récord ${g.juegoBest}</span></div><canvas id="jg-c" width="${W}" height="${H}" aria-label="Juego: pulsa espacio o toca para saltar"></canvas><p class="jg-hint">Espacio o toca para saltar</p></div>`;
    const c=o.querySelector('#jg-c'),x=c.getContext('2d');
    img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(avatarSVG(g.av,80));
    st={x,c,y:GROUND-PH,vy:0,hold:false,on:true,obs:[],clouds:[[120,40],[300,70],[430,30]],v:W<800?260:300,dist:0,next:500,t:performance.now(),dead:false};
    window.__jg=st;
    raf=requestAnimationFrame(loop);
  }
  const PH=62,PW=44,PX=70;
  function press(){if(!st||st.dead)return;st.hold=true;if(st.on){st.vy=-780;st.on=false;}}
  function release(){if(!st)return;st.hold=false;if(st.vy<-320)st.vy=-320;}
  function kd(e){if(e.code==='Escape'){if(st&&!st.dead){st.dead=true;cancelAnimationFrame(raf);}close();return;}
    if(e.code==='Space'||e.code==='ArrowUp'){if(st){e.preventDefault();if(!e.repeat)press();}}}
  function ku(e){if(e.code==='Space'||e.code==='ArrowUp')release();}
  addEventListener('keydown',kd);addEventListener('keyup',ku);
  o.addEventListener('pointerdown',e=>{if(st&&!st.dead&&!e.target.closest('button')){e.preventDefault();press();}});o.addEventListener('pointerup',release);
  function loop(now){
    if(!st||st.dead)return;
    const dt=Math.min((now-st.t)/1000,.05);st.t=now;
    st.v=Math.min(W<800?540:720,st.v+7*dt);st.dist+=st.v*dt;
    if(!st.on){st.vy+=2200*dt;st.y+=st.vy*dt;if(st.y>=GROUND-PH){st.y=GROUND-PH;st.vy=0;st.on=true;}}
    st.next-=st.v*dt;
    if(st.next<=0){const hard=st.dist>2500;const k=OBS[Math.floor(Math.random()*(hard?OBS.length:OBS.length-1))];st.obs.push({k,x:W+20,y:k.air?GROUND-112:GROUND-k.h});st.next=st.v*(.82+Math.random()*.95);}
    st.obs.forEach(b=>b.x-=st.v*dt);st.obs=st.obs.filter(b=>b.x+b.k.w>-10);
    st.clouds.forEach(cl=>{cl[0]-=st.v*.15*dt;if(cl[0]<-60)cl[0]=W+40;});
    const hx=PX+9,hy=st.y+10,hw=PW-18,hh=PH-14;
    for(const b of st.obs){const bx=b.x+4,by=b.y+4,bw=b.k.w-8,bh=b.k.h-6;if(hx<bx+bw&&hx+hw>bx&&hy<by+bh&&hy+hh>by){draw();return over();}}
    draw();
    const s=o.querySelector('#jg-s');if(s)s.textContent=Math.floor(st.dist/10);
    raf=requestAnimationFrame(loop);
  }
  function draw(){
    const {x}=st;x.clearRect(0,0,W,H);
    const sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#bfe3ff');sky.addColorStop(1,'#eaf6ff');x.fillStyle=sky;x.fillRect(0,0,W,H);
    x.fillStyle='rgba(255,255,255,.9)';st.clouds.forEach(([a,b])=>{x.fillRect(a,b,54,12);x.fillRect(a+10,b-8,30,8);});
    x.fillStyle='#5aa63c';x.fillRect(0,GROUND,W,H-GROUND);x.fillStyle='#3f7f2a';
    for(let i=0;i<W+40;i+=40){const px=i-(st.dist%40);x.fillRect(px,GROUND+8,18,4);x.fillRect(px+12,GROUND+22,10,4);}
    x.textBaseline='bottom';x.textAlign='left';
    st.obs.forEach(b=>{x.font=b.k.fs+'px serif';x.fillStyle='#000';x.fillText(b.k.e,b.x-2,b.y+b.k.h+4);});
    if(img&&img.complete&&img.naturalWidth){const h=PH+10,w=h*img.naturalWidth/img.naturalHeight;x.drawImage(img,PX+PW/2-w/2,st.y-8,w,h);}else{x.fillStyle='#3a3ca6';x.fillRect(PX,st.y,PW,PH);}
  }
  function over(){
    st.dead=true;cancelAnimationFrame(raf);
    const pts=Math.floor(st.dist/10),g=gLoad(),rec=pts>g.juegoBest;
    if(rec){g.juegoBest=pts;gSave(g);if(typeof ligaSubirJuego==='function')ligaSubirJuego();}
    const div=document.createElement('div');div.className='jg-over';
    div.innerHTML=`<h2>${rec?'¡Récord nuevo!':'¡Choque!'}</h2><div class="big" style="font-size:52px;font-weight:700">${pts}</div><p>${rec?'Has mejorado tu marca.':`Tu récord sigue en ${g.juegoBest}.`} Te ${g.fichas===1?'queda 1 ficha':'quedan '+g.fichas+' fichas'}.</p>${g.fichas>0?'<button class="lg-go" id="jg-re">Otra partida (1 ficha)</button>':'<p><b>Para tener más fichas, termina una misión.</b></p>'}<button class="lg-x" id="jg-m">Salir</button>`;
    o.querySelector('.jg-box').appendChild(div);
    const re=div.querySelector('#jg-re');if(re){re.onclick=start;setTimeout(()=>re.focus({preventScroll:true}),300);}
    div.querySelector('#jg-m').onclick=menu;
    const hint=o.querySelector('.jg-hint');if(hint)hint.remove();
  }
  menu();
}

 <button class="b" data-a="jugar">🎮 Jugar a saltar</button><button class="b" data-a="clasificacion">🏆 Clasificación y duelos</button><button class="b" data-a="muneco">🧑 Mi muñeco y premios</button><a class="back" href="index.html">Volver a las asignaturas</a>`;
 hub.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>OPEN[b.dataset.a](casa));}
