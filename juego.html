function gAward(n,time){
  const g=gLoad();if(g.prueba)return;const before=g.stars;g.stars+=n;
  if(time){g.edit=Math.min(G_CAP,g.edit+time);gGana(g);}
  const sj=typeof window!=='undefined'&&window.G_SUBJ;
  if(sj){const b4=gSubStars(g,sj);g.sub[sj]=b4+n;const tr=TRACKS.find(t=>t.id===sj);
    if(tr)tr.items.forEach((it,i)=>{if(b4<G_UMBRAL[i]&&g.sub[sj]>=G_UMBRAL[i]){g.fresh.push('@'+tr.id+':'+it[0]);g.av[tr.slot]=it[0];}});}
  G_ORDER.forEach(k=>{const c=gCost(k);if(before<c&&g.stars>=c){const [p,id]=k.split(':');g.fresh.push(k);g.av[p]=id;}});
  if(g.liga)(g.pend=g.pend||[]).push([sj||null,n,!!time]);
  gSave(g);gFlush();
}

     if(!st.boss&&st.jefeHecho!==key&&nd-pq<=260){st.boss={...JEFES[ix],fin:puntos()+300+100*Math.min(3,vuelta()),shot:1.6,f:0,x:W+80,ix};st.obs=st.obs.filter(b=>b.x<W*.6);st.jefeHecho=key;st.aviso={txt:JEFES[ix].e+' '+JEFES[ix].n,t:2,peq:true};SND.sfx('choque');}
     if(st.boss){const B=st.boss;B.f+=dt*3;B.x+=((W-95)-B.x)*Math.min(1,dt*3);st.next=Math.max(st.next,st.v*.6);B.shot-=dt;
      if(B.shot<=0&&B.fin-puntos()>40){const alto=Math.random()<.45+.1*Math.min(2,vuelta());st.obs.push({k:{e:B.p,w:30,h:26,fs:28,air:true,alto:alto?100:30},x:B.x-10,y:GROUND-(alto?100:30),vx:st.vb*(.35+.15*nivel(p0))});B.shot=1.05+Math.random()*.6-.35*nivel(p0)-.1*Math.min(2,vuelta());}
