async function ruta(){
 pinta('<section><p>Entrando…</p></section>');
 let q;try{q=await rpc('quien_soy');}catch(e){pinta(`<section><p class="err">${esc(trad(e.message))}</p><button class="alt" id="r">Reintentar</button></section>`);$('#r').onclick=ruta;return;}
 if(q.rol==='hijo'){guardaHijo(q);if(qs.get('nuevo'))return claveNueva(()=>vistaHijo(q));return vistaHijo(q);}
 panel(q);
}
let recup=false;
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){recup=true;setTimeout(()=>claveNueva(ruta),0);}});
(async()=>{
 const h=new URLSearchParams(location.hash.slice(1));
 if(h.get('error')||h.get('error_description')){history.replaceState(null,'',BASE);return entrar('Ese enlace ya no vale. Si eres alumno, pide a tu padre o tu madre que te lo reenvíe. Si es de tu cuenta, entra o recupera la contraseña.');}
 const {data}=await sb.auth.getSession();
 if(recup)return;
 if(data.session)ruta();else entrar();
})();
})();
</script></body></html>
