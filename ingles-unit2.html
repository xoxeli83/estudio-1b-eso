<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 2: Inglés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8eef6; --ink:#17203a; --soft:#57617a; --line:#c6d0e0; --white:#fff;
  --main:#3a3ca6; --main2:#2c2e87; --tint:#e4e5fa; --sun:#ffc93c;
  --ok:#17783f; --okbg:#dcf5e4; --no:#9a5200; --nobg:#fff0d6;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Lexend,Verdana,"Segoe UI",sans-serif;font-size:21px;line-height:1.45;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid #ff8a00;outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding:14px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:18px}
.link{background:none;border:0;padding:8px 2px;color:var(--soft);font-size:17px;text-decoration:underline;text-underline-offset:3px}
.bar{flex:1;height:12px;background:#ced8e6;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main);border-radius:6px;transition:width .25s}
.say{background:none;border:0;font-size:24px;padding:4px 6px;line-height:1}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:6vh}
h1{font-size:36px;line-height:1.15;margin:4px 0 12px}
h2{font-size:28px;line-height:1.2;margin:0 0 14px}
h3{font-size:21px;margin:26px 0 8px}
p{margin:0 0 12px}
.small{font-size:18px;color:var(--soft)}
.go{display:block;width:100%;border:0;border-radius:14px;background:var(--main);color:#fff;font-weight:700;font-size:24px;padding:18px;min-height:68px;margin-top:20px;box-shadow:0 5px 0 var(--main2)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--main2)}
.go:disabled{background:#aab3c6;box-shadow:none;cursor:default}
.alt{display:block;width:100%;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:19px;padding:13px;margin-top:12px}
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;margin-top:22px}
.dots{display:flex;flex-wrap:wrap;gap:7px;margin-top:22px;justify-content:center}
.dots i{width:18px;height:18px;border-radius:50%;background:#ced8e6}
.dots i.d{background:var(--main)}
.dots i.n{background:#fff;box-shadow:inset 0 0 0 4px var(--main)}
.dots i.pop{background:var(--sun);animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.7)}100%{transform:scale(1)}}

/* Lección */
.fact{display:flex;gap:16px;align-items:center;background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;font-size:23px;line-height:1.35}
.fact .ic{flex:none;width:58px;text-align:center;font-size:42px;line-height:1}
.fact .ic svg{width:44px;height:60px;display:block;margin:0 auto}
kbd{display:inline-block;font:inherit;font-weight:700;font-size:.9em;background:#fff;border:2px solid #8391ab;border-bottom-width:4px;border-radius:7px;padding:0 8px;white-space:nowrap}

/* Pregunta */
.tag{font-size:17px;color:var(--main);font-weight:500;margin-bottom:6px}
.q{font-size:29px;line-height:1.25;font-weight:500;margin-bottom:20px}
.q b{color:var(--main);font-weight:700}
.opts{min-height:230px}
.opt{display:flex;gap:13px;align-items:center;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:11px;min-height:66px;font-size:21px;line-height:1.25}
.opt:hover:not(:disabled){border-color:var(--main)}
.opt .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--main);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok .n{background:var(--ok);color:#fff}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt.fade{opacity:.4}
.fb{border-radius:14px;padding:13px 16px;font-size:20px;margin-top:4px}
.fb.ok{background:var(--okbg);color:#0e5c2e;font-weight:700}
.fb.no{background:var(--nobg)}
.fb strong{display:block;margin-bottom:2px}

/* Pausa y lista */
.count{font-size:92px;font-weight:700;line-height:1;color:var(--main);text-align:center;margin:18px 0 4px}
.move{font-size:70px;text-align:center;line-height:1.1}
.tick{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px;font-size:22px;min-height:66px}
.tick .b{flex:none;width:34px;height:34px;border:3px solid var(--main);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.tick.on{border-color:var(--ok);background:var(--okbg)}
.tick.on .b{background:var(--ok);border-color:var(--ok)}
.big{font-size:64px;font-weight:700;line-height:1;margin:6px 0}

/* Mapa, chuleta, padres */
.page{font-size:19px;background:#fff;border-radius:14px;padding:20px}
.page h2{margin-bottom:8px}
.page ul,.page ol{padding-left:22px;margin:6px 0 10px}
.page li{margin-bottom:7px}
.page a{color:var(--main)}
.mrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;font-size:19px}
.mrow:hover{background:var(--tint)}
.mrow .s{flex:none;width:28px;height:28px;border-radius:50%;background:#ced8e6;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px}
.mrow.d .s{background:var(--main)}
table{border-collapse:collapse;width:100%;font-size:17px;margin:6px 0 12px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--tint)}
select{font:inherit;font-size:17px;padding:6px;border-radius:8px;border:2px solid var(--line);background:#fff;max-width:100%}
label.cfg{display:block;margin:10px 0}
@media (max-width:560px){body{font-size:19px}h1{font-size:30px}.q{font-size:25px}.fact{font-size:21px;padding:14px}.opt{font-size:19px}.mid{padding-bottom:2vh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body{background:#fff}.no-print{display:none!important}.page{padding:0}#app{max-width:none}}

.av-svg{display:block;overflow:visible}
.av-banner{display:flex;gap:16px;align-items:center;background:#f1f4fb;border-radius:12px;padding:12px 16px;margin:12px 0;text-align:left}
.av-st{font-size:24px;font-weight:700;color:#17203a}
.av-new{font-size:19px;font-weight:700;color:#17783f}
.av-next{font-size:16px;color:#57617a}
#av-editor{position:fixed;inset:0;z-index:30;background:#dfe6f2;overflow:auto;padding:12px;font-family:Lexend,Verdana,"Segoe UI",sans-serif;color:#17203a}
.av-box{max-width:640px;margin:0 auto}
.av-head{position:sticky;top:-12px;background:#dfe6f2;padding:12px 0 6px;z-index:2;display:flex;gap:18px;align-items:center;justify-content:center;margin-bottom:10px}
.av-big{background:#fff;border-radius:14px;padding:10px 18px}
.av-time{font-size:17px;color:#57617a;margin-bottom:8px}
.av-done{font:inherit;font-weight:700;background:#3a3ca6;color:#fff;border:0;border-radius:10px;padding:10px 26px;font-size:19px;min-height:48px;cursor:pointer}
.av-tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.av-tabs button{font:inherit;font-size:16px;background:#fff;border:2px solid #c6d0e0;border-radius:9px;padding:7px 12px;min-height:42px;cursor:pointer;color:#17203a}
.av-tabs button.on{background:#3a3ca6;color:#fff;border-color:#3a3ca6}
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.av-opt{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#fff;border:3px solid #c6d0e0;border-radius:10px;padding:8px 4px;min-height:112px;cursor:pointer;color:#17203a}
.av-opt.on{border-color:#17783f;background:#dcf5e4}
.av-opt.lock{background:#eef1f6;cursor:default;color:#57617a}
.av-lock{font-size:30px}
.av-n{font-size:14px;line-height:1.2;text-align:center}
.av-out{text-align:center;padding-top:8vh}
.av-out .av-svg{margin:0 auto}
.av-out h2{font-size:26px;margin:14px 0 6px}
.av-out p{font-size:19px}
.av-home{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;margin-bottom:8px;font:inherit;cursor:pointer;color:inherit}
.av-home b{font-size:20px}
.icon .av-svg{margin:0 auto 6px}

.av-pal{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;margin-bottom:10px;background:#fff;border-radius:10px;padding:8px}
.av-pal button{aspect-ratio:1;border:0;border-radius:3px;padding:0;cursor:pointer;min-width:0}
.av-pal button.on{outline:3px solid #17203a;outline-offset:1px}
#lg{position:fixed;inset:0;z-index:30;background:#dfe6f2;overflow:auto;padding:12px;font-family:Lexend,Verdana,"Segoe UI",sans-serif;font-size:18px;line-height:1.4;color:#17203a}
.lg-box{max-width:640px;margin:0 auto;padding-bottom:30px}
.lg-box h2{font-size:26px;margin:8px 0 12px}.lg-box h3{font-size:20px;margin:18px 0 4px}
.lg-x,.lg-del{font:inherit;background:none;border:0;color:#57617a;text-decoration:underline;font-size:16px;padding:8px 2px;cursor:pointer}
.lg-del{display:block;margin:20px auto 0}
.lg-s{font-size:15px;color:#57617a;margin:0 0 6px}
.lg-l{display:block;margin:10px 0;font-weight:500}.lg-l input{display:block;width:100%;font:inherit;font-size:20px;padding:11px;border:2px solid #c6d0e0;border-radius:10px;margin-top:4px}
.lg-ck{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:17px}.lg-ck input{width:22px;height:22px;flex:none;margin-top:2px}
.lg-err{color:#9a5200;font-weight:500;min-height:1.3em;font-size:16px}
.lg-go{font:inherit;font-weight:700;display:block;width:100%;background:#3a3ca6;color:#fff;border:0;border-radius:12px;padding:14px;font-size:21px;min-height:58px;cursor:pointer;margin-top:10px}
.lg-top{display:flex;justify-content:space-between;align-items:center}.lg-me{display:flex;gap:10px;align-items:center;text-align:left}
.lg-reto{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff0d6;border-radius:12px;padding:12px;margin-top:8px}
.lg-ts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lg-t{background:#fff;border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font-size:16px}.lg-te{font-size:36px;line-height:1.1}
.lg-mini{font:inherit;font-weight:700;font-size:15px;background:#3a3ca6;color:#fff;border:0;border-radius:9px;padding:8px 12px;min-height:40px;cursor:pointer;flex:none}
.lg-tabs{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.lg-tabs button{font:inherit;font-size:15px;background:#fff;border:2px solid #c6d0e0;border-radius:9px;padding:6px 10px;min-height:40px;cursor:pointer;color:#17203a}.lg-tabs button.on{background:#3a3ca6;color:#fff;border-color:#3a3ca6}
.lg-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:6px 10px;margin-top:5px;font-size:17px}.lg-row.me{outline:3px solid #3a3ca6}.lg-pos{width:24px;text-align:center;font-weight:700;color:#57617a}.lg-name{flex:1;min-width:0;overflow-wrap:anywhere}
.lg-q{font-size:25px;font-weight:500;line-height:1.25;margin:6px 0 16px}.lg-q b{color:#3a3ca6}
.lg-opt{display:block;width:100%;text-align:left;font:inherit;font-size:19px;background:#fff;border:3px solid #c6d0e0;border-radius:12px;padding:13px;margin-bottom:9px;min-height:58px;cursor:pointer;color:#17203a}.lg-opt.ok{background:#dcf5e4;border-color:#17783f}.lg-opt.no{background:#fff0d6;border-color:#9a5200}
.lg-end{text-align:center;padding-top:10vh}

.av-tr{font-size:16px;margin:12px 0 5px}.av-tr small{color:#57617a;font-weight:400}
.av-prem{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.av-pr{font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:3px solid #c6d0e0;border-radius:10px;padding:6px 2px;min-height:78px;cursor:pointer;color:#17203a}
.av-pr span{font-size:28px;line-height:1.1}.av-pr small{font-size:12px;line-height:1.15;text-align:center}
.av-pr.on{border-color:#17783f;background:#dcf5e4}.av-pr.lock{background:#eef1f6;color:#57617a;cursor:default}
#jg{position:fixed;inset:0;z-index:30;background:#dfe6f2;overflow:auto;padding:12px;font-family:Lexend,Verdana,"Segoe UI",sans-serif;font-size:18px;line-height:1.4;color:#17203a}
.jg-box{position:relative;max-width:820px;margin:0 auto}
.jg-box h2{font-size:30px;margin:6px 0 10px}
.jg-hero{display:flex;gap:16px;align-items:center;margin:8px 0 12px}
.jg-k{display:inline-block;font:inherit;font-weight:700;font-size:.9em;background:#fff;border:2px solid #8391ab;border-bottom-width:4px;border-radius:7px;padding:0 8px}
.jg-empty{background:#fff0d6;border-radius:12px;padding:14px;margin-top:10px}
.jg-score{display:flex;justify-content:space-between;align-items:baseline;font-size:30px;font-weight:700;margin-bottom:6px}
.jg-best{font-size:16px;font-weight:400;color:#57617a}
#jg-c{display:block;width:100%;height:auto;border-radius:12px;touch-action:none;user-select:none;cursor:pointer}
.jg-hint{font-size:16px;color:#57617a;text-align:center;margin:8px 0}
.jg-over{background:#fff;border-radius:14px;padding:14px 18px;margin-top:10px;text-align:center}.jg-over h2{margin:0}.jg-over p{margin:6px 0}

.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-weight:500}.frac i{font-style:normal;padding:0 3px}.frac i:first-child{border-bottom:2px solid currentColor}
.en{color:#1f4fb8;font-weight:500}
.fact .en{white-space:normal}
</style>
</head>

<script>
window.G_SUBJ='ingles';
/* Variantes: id de la pregunta -> [enunciado, respuesta correcta, incorrectas...] */
const VAR={
1:[['¿Dónde están los iconos de **inicio rápido**?','En la barra de tareas.','En el Panel de control.','En la papelera.','Dentro de Este equipo.'],
['La **barra de tareas** contiene…','La barra de inicio rápido.','El Panel de control entero.','La papelera de reciclaje.','El desfragmentador.'],
['La barra de inicio rápido **se encuentra en…**','La barra de tareas.','El menú de Paint.','El árbol del Explorador.','La ventana de la papelera.']],
2:[['Windows funciona con ventanas e iconos. Por eso es…','De interfaz gráfica.','De solo texto.','De solo teclado.','Un programa de dibujo.'],
['¿Qué tipo de **programa** es Windows?','Un sistema operativo.','Un navegador web.','Un programa de dibujo.','Una hoja de cálculo.'],
['**Interfaz gráfica** significa que usamos…','Ventanas e iconos.','Solo líneas de texto.','Solo números.','Solo el micrófono.']],
3:[['¿Desde dónde llegas a **todo el sistema**?','Desde el menú Inicio.','Desde la papelera.','Desde el reloj.','Desde Paint.'],

['El botón con el **logo de Windows** abre…','El menú Inicio.','La papelera.','La calculadora.','El Mapa de caracteres.']],
4:[['Una ventana **minimizada**…','Sigue abierta en la barra de tareas.','Se ha cerrado del todo.','Ha ido a la papelera.','Se ha borrado del disco.'],
['Has minimizado Word. ¿Dónde lo **encuentras**?','En la barra de tareas.','En la papelera.','En el Panel de control.','En Este equipo.'],
['¿**Minimizar** es lo mismo que cerrar?','No: se recupera en la barra de tareas.','Sí: el programa se cierra del todo.','Sí: se pierde todo lo escrito.','No: se va a la papelera.']],
5:[['Haces clic con el **botón derecho**. ¿Qué sale?','El menú contextual.','La ayuda de Windows.','El administrador de tareas.','El Panel de control.'],

['El menú que cambia según **dónde haces clic derecho** se llama…','Menú contextual.','Menú Inicio.','Panel de control.','Barra de tareas.']],
6:[['Un **atajo** a un programa es un…','Acceso directo.','Formateo.','Desfragmentador.','Portapapeles.'],
['¿Para qué sirve un **acceso directo**?','Para abrir rápido un programa.','Para borrar un programa.','Para copiar todo el disco.','Para cambiar de usuario.'],
['Un **acceso directo** en el escritorio…','Abre rápido un programa.','Es el programa entero.','Ocupa el disco completo.','Solo sirve para imprimir.']],
7:[['Tienes Word y Paint abiertos. ¿Cómo **saltas** de uno a otro?','ALT + TAB','CTRL + E','CTRL + X','F1'],
['¿Qué combinación **cambia de ventana**?','ALT + TAB','CTRL + C','CTRL + V','ALT + F1'],

9:[['¿Qué hace **Windows + D**?','Muestra el escritorio.','Abre el Panel de control.','Borra el archivo.','Cierra la sesión.'],

10:[['El acceso directo del **escritorio** se abre con…','Doble clic.','Un solo clic.','Tres clics.','La tecla F1.'],

11:[['Quieres cambiar el **fondo de pantalla**.','Botón derecho en el escritorio.','CTRL + E en el escritorio.','Doble clic en la papelera.','F1 en el escritorio.'],

12:[['La **resolución de pantalla** se cambia en…','Configuración de pantalla.','Configuración de la papelera.','El Mapa de caracteres.','El liberador de espacio.'],

13:[['**ClearType** sirve para…','Leer mejor en pantalla.','Comprobar errores del disco.','Borrar archivos temporales.','Cambiar de usuario.'],
['Las letras se ven **borrosas**. ¿Qué ajustas?','ClearType.','Paint.','Desfragmentador.','Papelera.'],
['¿Cuál **mejora la lectura** en pantalla?','ClearType','Scandisk','Paint','Liberador']],
14:[['Si dos personas usan el ordenador, **Documentos**…','Es distinto para cada una.','Es el mismo para las dos.','Solo lo ve el administrador.','Está en la papelera.'],
['¿De quién es la carpeta **Documentos**?','De cada usuario.','Solo del administrador.','De todos a la vez.','Del Panel de control.'],
['Tu hermano entra con su cuenta. Sus **documentos**…','Están en su carpeta.','Están en tu carpeta.','Están en la papelera.','Se borran al salir.']],

function gAward(n,time){
  const g=gLoad(),before=g.stars;g.stars+=n;
  if(time){g.edit=Math.min(G_CAP,g.edit+time);g.fichas=Math.min(G_FMAX,g.fichas+1);}
  const sj=typeof window!=='undefined'&&window.G_SUBJ;
  if(sj){const b4=gSubStars(g,sj);g.sub[sj]=b4+n;const tr=TRACKS.find(t=>t.id===sj);
    if(tr)tr.items.forEach((it,i)=>{if(b4<G_UMBRAL[i]&&g.sub[sj]>=G_UMBRAL[i]){g.fresh.push('@'+tr.id+':'+it[0]);g.av[tr.slot]=it[0];}});}
  G_ORDER.forEach(k=>{const c=gCost(k);if(before<c&&g.stars>=c){const [p,id]=k.split(':');g.fresh.push(k);g.av[p]=id;}});
  gSave(g);
}

function gRacha(g){let n=0;const d=new Date();for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(g.st.days.includes(k)){n++;d.setDate(d.getDate()-1);}else{if(n===0&&k===gHoy()){d.setDate(d.getDate()-1);continue;}break;}}return n;}

function gNext(g){const k=G_ORDER.find(x=>g.stars<gCost(x));if(!k)return null;const [p,id]=k.split(':');return{name:PARTS[p].o[id].n,left:gCost(k)-g.stars,part:PARTS[p].t};}

function gBanner(){
  const g=gLoad(),fresh=g.fresh;g.fresh=[];gSave(g);if(typeof ligaSync==='function')ligaSync();

  const pct=Math.round(R.pos/R.queue.length*100);
  const tag=it.rev&&R.kind==='mission'?'<div class="tag">Una de repaso</div>':it.again?'<div class="tag">Otra vez, ahora sale</div>':'';
  shell(`${tag}<div class="q">${fmt(q.q)}</div><div class="opts" id="opts"></div><div id="fb"></div>`,{pct,say:q.say||(q.q+' '+opts.map((o,i)=>`${i+1}: ${o}`).join('. '))});gOye(q);
  let done=false;
  const answer=k=>{
    if(done)return;done=true;
    const right=opts[k]===q.a;
    document.querySelectorAll('.opt').forEach((b,x)=>{b.disabled=true;if(opts[x]===q.a)b.classList.add('ok');else if(x===k)b.classList.add('no');else b.classList.add('fade');});
    ding(right);
    if(right){
      if(it.rev)delete S.wrong[it.id];
      gCorrect(it.id==+it.id?+it.id:it.id);if(!it.again)gAward(1);
      if(it.again)R.fixed++;
      save();
      document.getElementById('fb').innerHTML=`<div class="fb ok" role="status">${pick(RIGHT)}</div>`;
      const nx=()=>{R.pos++;showQ();};
      later(nx,AUTO_NEXT);keyH=e=>{if(e.key==='Enter'){e.preventDefault();nx();}};
    }else{
      S.wrong[it.id]=true;save();
      if((R.tries[it.id]||0)<2){R.tries[it.id]=(R.tries[it.id]||0)+1;R.queue.push({id:it.id,again:true,rev:it.rev});}
      document.getElementById('fb').innerHTML=`<div class="fb no" role="status"><strong>Es la verde.</strong>${gF(q.n)}</div><button class="go" id="nx">Seguir</button>`;
      const nx=()=>{R.pos++;showQ();};
      const b=document.getElementById('nx');b.onclick=nx;b.focus({preventScroll:true});b.scrollIntoView({block:'nearest'});
      keyH=e=>{if(e.key==='Enter'){e.preventDefault();nx();}};
    }
  };
  later(()=>{
    document.getElementById('opts').innerHTML=opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="n">${i+1}</span><span>${gF(o)}</span></button>`).join('');
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
    keyH=e=>{const n=+e.key;if(n>=1&&n<=opts.length){e.preventDefault();answer(n-1);}};
  },OPT_DELAY);
}
function afterMission(){
  const i=R.i,m=M[i],fixed=R.fixed;
  const finish=()=>{
    const was=S.done[i];S.done[i]=true;S.sess.n++;S.sess.since++;S.sess.ts=Date.now();save();gAward(was?2:5,60);const banner=gBanner();
    if(!was)popIndex=i;
    clearAll();
    const extra=fixed?`<p class="big" style="font-size:24px">Y has arreglado ${fixed===1?'una que se te resistía':fixed+' que se te resistían'}.</p>`:'';
    shell(`<h1>${pick(PRAISE)}</h1>${extra}${banner}<p class="small">${Object.keys(S.done).length} de ${M.length} misiones</p>${dots()}<button class="go" id="go">${nextLabel()}</button>`,{exit:false});
    popIndex=null;
    const go=()=>route();
    document.getElementById('go').onclick=go;document.getElementById('go').focus({preventScroll:true});
    keyH=e=>{if(e.key==='Enter'){e.preventDefault();go();}};
  };
  if(m.try){
    clearAll();
    shell(`<h2>Reto en tu cuaderno</h2><div class="fact"><span class="ic">✏️</span><span>${fmt(m.try)}</span></div><button class="go" id="go">¡Hecho!</button><button class="alt" id="no">Ahora no</button>`,{pct:100,say:m.try});
    document.getElementById('go').onclick=()=>{gAward(3);finish();};document.getElementById('no').onclick=finish;
  }else finish();
}
function nextLabel(){if(S.sess.n>=S.cfg.per)return'Seguir';if(S.sess.since>=S.cfg.brk)return'Toca moverse';return M.some((_,k)=>!S.done[k])?'Siguiente misión':'Seguir';}
function route(){
  clearAll();
  if(S.sess.n>=S.cfg.per)return stopToday();
  if(S.sess.since>=S.cfg.brk){S.sess.since=0;save();return move(nextOrHome);}
  nextOrHome();
}
function nextOrHome(){const E=window.EX&&S.best==null?window.EX:M.length;const i=M.findIndex((_,k)=>k<E&&!S.done[k]);if(i>=0)lesson(i);else home();}
function afterReview(){
  clearAll();gAward(3,60);const banner=gBanner();
  shell(`<h1>Repaso hecho</h1>${banner}<p class="small">${wrongIds().length?`Quedan ${wrongIds().length} para otro rato.`:'No queda ninguna pendiente.'}</p><button class="go" id="go">Seguir</button>`,{exit:false});
  document.getElementById('go').onclick=home;document.getElementById('go').focus({preventScroll:true});
}

/* ===== Pausa de movimiento ===== */
function move(next,head){
  clearAll();const [ic,tx]=pick(MOVES);let t=BREAK_SECS;
  shell(`${head||''}<h2 style="text-align:center">Toca moverse</h2><div class="move">${ic}</div><p style="text-align:center;font-size:25px;font-weight:500">${tx}</p><div class="count" id="c">${t}</div><button class="go" id="go" disabled>Seguir</button>`,{exit:true,say:tx});
  const tick=()=>{t--;const c=document.getElementById('c');if(!c)return;c.textContent=Math.max(t,0);if(t<=0){const g=document.getElementById('go');g.disabled=false;g.focus({preventScroll:true});ding(true);keyH=e=>{if(e.key==='Enter'){e.preventDefault();next();}};}else later(tick,1000);};
  document.getElementById('go').onclick=()=>next();
  if(t<=0){t=1;}later(tick,1000);
}
function stopToday(){
  clearAll();
  shell(`<div class="move">🏁</div><h1 style="text-align:center">Por ahora, terminado</h1><p style="text-align:center">Tu cerebro necesita un descanso largo para guardar lo aprendido. Ya puedes cerrar esto.</p>${dots()}<button class="alt" id="more">Quiero seguir un poco más</button>`,{exit:false});
  document.getElementById('more').onclick=()=>{S.sess.n=0;S.sess.since=0;S.sess.ts=Date.now();save();move(home);};
}

/* ===== Simulacro ===== */
function simIntro(){
  clearAll();
  shell(`<h2>Simulacro: 30 preguntas</h2>
   <div class="fact"><span class="ic">👀</span><span><b>Lee toda</b> la pregunta.</span></div>
   <div class="fact"><span class="ic">❌</span><span><b>Descarta</b> la que seguro que no es.</span></div>
   <div class="fact"><span class="ic">✅</span><span><b>Marca</b> y sigue. Sin prisa.</span></div>
   <p class="small">Pausa a las 10 preguntas.</p><button class="go" id="go">Empezar</button>`);
  const go=()=>{R={kind:'sim',ids:(()=>{const s=shuffle(OFFICIAL.map(x=>String(x.id)));return Array.from({length:30},(_,i)=>s[i%s.length]);})(),pos:0,ok:0,bok:0,miss:[]};simQ();};
  document.getElementById('go').onclick=go;document.getElementById('go').focus({preventScroll:true});
}
function simQ(){
  clearAll();
  if(R.pos>=R.ids.length)return simEnd();
  const q=pickVar(byId[R.ids[R.pos]]),opts=shuffle([q.a,...q.w]);window.CURQ=q;
  shell(`<div class="tag">Pregunta ${R.pos+1} de 30</div><div class="q">${fmt(q.q)}</div><div class="opts" id="opts"></div>`,{pct:R.pos/30*100,say:q.say||(q.q+' '+opts.map((o,i)=>`${i+1}: ${o}`).join('. '))});gOye(q);
  let done=false;
  const answer=k=>{if(done)return;done=true;
    if(opts[k]===q.a){R.ok++;R.bok++;delete S.wrong[q.id];gCorrect(q.id);}else{R.miss.push(String(q.id));R.mq=R.mq||{};R.mq[q.id]=q;S.wrong[q.id]=true;}
    save();R.pos++;
    if(R.pos<R.ids.length&&R.pos%10===0){const n=R.bok;R.bok=0;move(simQ,`<p style="text-align:center;font-size:24px;font-weight:700">${n} de 10 en este trozo</p>`);}
    else simQ();};
  later(()=>{document.getElementById('opts').innerHTML=opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="n">${i+1}</span><span>${gF(o)}</span></button>`).join('');
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
    keyH=e=>{const n=+e.key;if(n>=1&&n<=opts.length){e.preventDefault();answer(n-1);}};},OPT_DELAY);
}
function simEnd(){
  clearAll();gSim(R.ok);gAward(15,60);const banner=gBanner();const ok=R.ok;const prev=S.best;if(prev===null||ok>prev){S.best=ok;save();}
  const msg=prev!==null&&ok>prev?`Has mejorado: antes, ${prev}.`:ok>=27?'Lo tienes muy bien.':ok>=18?'Vas bien. Repasa lo que ha fallado.':'Terminar el simulacro ya es un logro. Ahora toca repasar.';
  const list=R.miss.map(id=>{const q=R.mq[id];return `<p style="margin:0 0 10px"><span class="small">${fmt(q.q)}</span><br><b style="color:var(--ok)">${gF(q.a)}</b></p>`;}).join('');
  shell(`<div class="big">${ok} de 30</div><p>${msg}</p>${banner}
    ${R.miss.length?'<button class="go" id="rp">Repasar 5 fallos</button>':''}<button class="alt" id="hm">Volver al inicio</button>
    ${list?`<h3>Las respuestas de las que has fallado</h3>${list}`:''}`,{exit:false});
  document.getElementById('hm').onclick=home;
  const r=document.getElementById('rp');if(r)r.onclick=startReview;
}

/* ===== Páginas de apoyo ===== */
function map(){
  clearAll();
  shell(`<div class="page"><h2>Misiones</h2>${M.map((m,i)=>`<button class="mrow ${S.done[i]?'d':''}" data-i="${i}"><span class="s">${S.done[i]?'✓':''}</span>${i+1}. ${m.t}</button>`).join('')}
   <button class="mrow" id="sim"><span class="s">📝</span>Simulacro de examen</button>${wrongIds().length?`<button class="mrow" id="rv"><span class="s">🔁</span>Repasar lo que costó (${wrongIds().length})</button>`:''}</div>`);
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>ready(()=>lesson(+b.dataset.i)));
  document.getElementById('sim').onclick=()=>ready(simIntro);
  const v=document.getElementById('rv');if(v)v.onclick=()=>ready(startReview);
}
function cheat(){
  clearAll();
  shell(`<div class="page"><h2>Chuleta de la Unit 2</h2>${fmt(`<table><tr><td><b>do / have</b></td><td>~do an experiment, do your homework, do gymnastics, have lunch, have a break~</td></tr><tr><td><b>Otros verbos</b></td><td>~play chess, play football, play a musical instrument, read a book, use a computer, act in a play, take an exam~</td></tr><tr><td><b>Días</b></td><td>~Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday~, con mayúscula</td></tr><tr><td><b>Asignaturas</b></td><td>~Art, Citizenship, Drama, English, French, Geography, German, History, ICT, Maths, Music, PE, Religious Studies, Science, Spanish, Technology~</td></tr><tr><td><b>can</b></td><td>~I can swim.~ Igual para todos, sin «s» y sin «to»</td></tr><tr><td><b>can't</b></td><td>~She can't swim.~ Nunca ~don't can~</td></tr><tr><td><b>Preguntas</b></td><td>~Can you act? Yes, I can. / No, I can't.~</td></tr><tr><td><b>Tabla</b></td><td>✔️ can, ❌ can't: ~Alice can speak Spanish, but Jos can't.~</td></tr><tr><td><b>Usos de can</b></td><td>Habilidad: ~My dad can cook.~ Posibilidad: ~You can eat here.~</td></tr><tr><td><b>Adverbios</b></td><td>~always, usually / normally, often, sometimes, never~</td></tr><tr><td><b>Verbo normal</b></td><td>Delante: ~I always do my homework.~</td></tr><tr><td><b>Verbo to be</b></td><td>Detrás: ~Our teacher is never late.~</td></tr><tr><td><b>Negativa</b></td><td>~I don't often watch TV.~ Nunca ~don't never~</td></tr><tr><td><b>in</b></td><td>~in Australia, in a class, in a house~. También meses y partes del día</td></tr><tr><td><b>at</b></td><td>~at home, at work, at school~. También horas</td></tr><tr><td><b>on</b></td><td>~on holiday, on a farm~. También días</td></tr><tr><td><b>En clase</b></td><td>~Excuse me… / What does it mean? / How do you say it in English? / How do you spell that? / Could you repeat that, please? / Could you speak more slowly, please? / Can I borrow your dictionary, please?~</td></tr><tr><td><b>Responder</b></td><td>~Yes, of course. / Sorry, I don't know. / I'm not sure. / Sorry, I don't understand. / Sorry, I'm using it.~</td></tr><tr><td><b>Conjunciones</b></td><td>~and~ añade, ~or~ da a elegir, ~but~ contrasta</td></tr></table>`)}<button class="alt no-print" id="pr">Imprimir</button></div>`);
  document.getElementById('pr').onclick=()=>window.print();
}
function parents(){
  clearAll();
  shell(`<div class="page"><h2>Para padres</h2>
   <p>Estudio en tandas cortas, con pausas y premios.</p>
   <h3>Cómo usarla</h3>
   <ol><li>Misma hora cada día, tras un rato libre al salir de clase.</li><li>Sesiones de unos 15 minutos: 6 misiones y la página le manda parar.</li><li>Dos o tres sesiones separadas valen más que una larga.</li><li>Quédate cerca haciendo otra cosa. No hace falta que le ayudes.</li><li>Elogia que empiece y que siga, no la nota.</li><li>Si se bloquea, para: suele ser cansancio, no mala actitud.</li><li>El simulacro, al final, y como mucho uno al día.</li></ol>
   <h3>Ajustes</h3>
   <label class="cfg">Pausa cada <select id="c-b"><option value="1">1 misión</option><option value="2">2 misiones</option><option value="3">3 misiones</option></select></label>
   <label class="cfg">Parar tras <select id="c-p"><option value="4">4 misiones</option><option value="6">6 misiones</option><option value="8">8 misiones</option><option value="12">12 misiones</option></select></label>
   <label class="cfg">Sonido <select id="c-s"><option value="1">Sí</option><option value="0">No</option></select></label>
   <button class="alt" id="rs">Borrar todo el progreso</button></div>`);
  const b=document.getElementById('c-b'),p=document.getElementById('c-p'),s=document.getElementById('c-s');
  b.value=S.cfg.brk;p.value=S.cfg.per;s.value=S.cfg.snd?'1':'0';
  b.onchange=()=>{S.cfg.brk=+b.value;save();};p.onchange=()=>{S.cfg.per=+p.value;save();};s.onchange=()=>{S.cfg.snd=s.value==='1';save();};
  const rs=document.getElementById('rs');let armed=false;
  rs.onclick=()=>{if(!armed){armed=true;rs.textContent='Pulsa otra vez para borrarlo';return;}
    S={done:{},wrong:{},sess:{n:0,since:0,ts:0,ok:false},cfg:S.cfg,best:null};save();home();};
}
document.addEventListener('keydown',e=>{if(keyH&&!e.ctrlKey&&!e.altKey&&!e.metaKey)keyH(e);});
home();
</script>
