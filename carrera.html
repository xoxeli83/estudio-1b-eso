function pickVar(base){
  const vs=VAR[String(base.id)];
  if(!vs||!vs.length)return base;
  const i=Math.floor(Math.random()*(vs.length+1));
  if(i===vs.length)return base;
  const c=vs[i];
  return {id:base.id,b:base.b,c:base.c,n:base.n,q:c[0],a:c[1],w:c.slice(2)};
}

const G_FMAX=3,G_FPASO=2*3600*1000;
function gFichas(g){const now=Date.now();if(g.fichas>G_FMAX)g.fichas=G_FMAX;if(g.fichas>=G_FMAX){g.fichaT=now;return g;}if(!g.fichaT)g.fichaT=now;const n=Math.floor((now-g.fichaT)/G_FPASO);if(n>0){g.fichas=Math.min(G_FMAX,g.fichas+n);g.fichaT=g.fichas>=G_FMAX?now:g.fichaT+n*G_FPASO;}return g;}

  const r=await fetch(LIGA.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:LIGA.key,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&j.message)||'No se ha podido conectar');
  return j;
}
function gEstudio(g){return Math.round(Object.keys(g.st.ok).length/63*100);}
function ligaSync(){
  const g=gLoad();if(!ligaOn()||!g.liga)return Promise.resolve();
  return ligaRpc('actualizar',{p_token:g.liga.token,p_avatar:g.av,p_estrellas:g.stars,p_estudio:gEstudio(g),p_mejor:g.st.best,p_primero:g.st.first,p_racha:gRacha(g)}).catch(()=>{});
}
function ligaSubirJuego(){const g=gLoad();if(!ligaOn()||!g.liga||!g.juegoBest)return Promise.resolve();return ligaRpc('puntuar_juego',{p_token:g.liga.token,p_pts:g.juegoBest}).catch(()=>{});}
function rng32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function dueloPreguntas(seed){
  const r=rng32(seed),ids=Object.keys(VAR).filter(k=>/^\d+$/.test(k)&&VAR[k].every(v=>v.length>=5));
  const out=[];
  while(out.length<5){const id=ids[Math.floor(r()*ids.length)];if(out.some(x=>x.id===id))continue;
    const v=VAR[id][Math.floor(r()*VAR[id].length)],opts=[v[1],v[2],v[3],v[4]];
    for(let i=3;i>0;i--){const j=Math.floor(r()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
    out.push({id,q:v[0],a:v[1],opts});}
  return out;
}
function openLeague(onClose){

  let tab='estudio',data=null;

  const showErr=(id,m)=>{const e=o.querySelector('#'+id);if(e)e.textContent=m;};
  function join(){

    o.querySelector('#lg-x').onclick=close;
    o.querySelector('#lg-j').onclick=async()=>{
      if(!o.querySelector('#lg-p').checked)return showErr('lg-e','Antes necesitas el permiso de tu padre, madre o tutor.');
      try{const g=gLoad();const r=await ligaRpc('unirse',{p_codigo:o.querySelector('#lg-c').value.trim(),p_apodo:o.querySelector('#lg-a').value,p_avatar:g.av});

  async function load(){

  }
  const COLS={estudio:['Estudio',x=>x.estudio,x=>x.estudio+' %'],estrellas:['Estrellas',x=>x.estrellas,x=>'⭐ '+x.estrellas],juego:['Juego',x=>x.juego,x=>'🎮 '+(x.juego||0)],simulacro:['Simulacro',x=>x.simulacro,x=>x.simulacro==null?'–':x.simulacro+' de 50'],mejora:['Mejora',x=>x.mejora,x=>x.mejora==null?'–':'+'+x.mejora],racha:['Días seguidos',x=>x.racha,x=>x.racha+(x.racha===1?' día':' días')]};
  function main(){
    const me=data.jugadores.find(x=>x.id===data.yo);
    const trof=id=>data.trofeos.filter(t=>t.dueno===id).map(t=>t.trofeo);
    const c=COLS[tab];
    const rows=[...data.jugadores].sort((a,b)=>(c[1](b)??-1)-(c[1](a)??-1));
    let pos=0,prev=null;
    const list=rows.map((x,i)=>{const v=c[1](x)??-1;if(v!==prev){pos=i+1;prev=v;}

    const nameOf=id=>{const j=data.jugadores.find(x=>x.id===id);return j?j.apodo:null;};
    const cards=['corona','capa','rayo'].map(k=>{const t=data.trofeos.find(x=>x.trofeo===k);const own=t&&t.dueno===data.yo;const who=t&&nameOf(t.dueno);
      return `<div class="lg-t"><div class="lg-te">${TROFEOS[k].e}</div><b>${TROFEOS[k].n}</b><span class="lg-s">${own?'¡Es tuyo!':who?esc(who):'Sin dueño'}</span>${own?'':`<button class="lg-mini" data-r="${k}">${who?'Retar':'Conseguir'}</button>`}</div>`;}).join('');
    const retos=data.retos.map(r=>`<div class="lg-reto"><span>${TROFEOS[r.trofeo].e} <b>${esc(r.retador)}</b> te reta por tu ${TROFEOS[r.trofeo].n.toLowerCase()}. Tienes 48 horas.</span><button class="lg-mini" data-d="${r.id}">Defender</button></div>`).join('');

      ${retos}<h3>Trofeos</h3><p class="lg-s">Se ganan en duelos de 5 preguntas. Lo que has ganado con estrellas nunca se pierde.</p><div class="lg-ts">${cards}</div><div class="lg-err" id="lg-e" role="alert"></div>

    o.querySelector('#lg-x').onclick=close;

    o.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{try{const t=gLoad().liga.token;const r=await ligaRpc('retar',{p_token:t,p_trofeo:b.dataset.r});play(r.semilla,async p=>{const x=await ligaRpc('enviar_reto',{p_token:t,p_duelo:r.id,p_pts:p});return x.resultado==='ganado'?`¡${p} de 5! El trofeo es tuyo.`:x.resultado==='no_llega'?`${p} de 5. Hacen falta 3 aciertos para conseguirlo.`:`${p} de 5. Ahora le toca responder a tu rival.`;});}catch(e){showErr('lg-e',e.message);}});

}

 const go=$('#cr-start');if(go)go.onclick=()=>{const h=gLoad();if(h.fichas<=0)return menu();h.fichas--;gSave(h);const d=datos(h);correr(CIRC.find(c=>c.id===d.sel.c),VEH.find(v=>v.id===d.sel.v),d.sel.a);};
}
const barras=v=>`Vel ${Math.round(v.v*100)} · Giro ${Math.round(v.g*100)}`;
/* Padres: la nota no se escribe ni se guarda */
function padres(){
 const g=gLoad(),D=datos(g);
 const caja=(cuerpo)=>{app.innerHTML=`<div class="cr-box"><h1>👪 Para padres</h1>${cuerpo}<button class="cr-link" id="cr-v">Volver</button></div>`;$('#cr-v').onclick=menu;};
 if(!D.pin){caja(`<p>Crea un PIN para que solo vosotros podáis dar premios. Se guarda en este dispositivo.</p><label class="cr-l">PIN nuevo (4 cifras o más)<input id="cr-p" type="password" inputmode="numeric" autocomplete="off"></label><p class="cr-e" id="cr-e"></p><button class="cr-go" id="cr-ok">Guardar PIN</button>`);
  $('#cr-ok').onclick=()=>{const v=$('#cr-p').value.trim();if(!/^\d{4,}$/.test(v)){$('#cr-e').textContent='Usa 4 cifras o más.';return;}const h=gLoad();datos(h).pin=hash(v);gSave(h);panel();};return;}
 caja(`<label class="cr-l">Escribe vuestro PIN<input id="cr-p" type="password" inputmode="numeric" autocomplete="off"></label><p class="cr-e" id="cr-e"></p><button class="cr-go" id="cr-ok">Entrar</button>`);
 $('#cr-ok').onclick=()=>{if(hash($('#cr-p').value.trim())===D.pin)panel();else $('#cr-e').textContent='PIN incorrecto.';};
 function panel(){const h=gLoad(),d=datos(h);caja(`<p>Después de un examen, elige si hay motivo para un premio. <b>No se escribe ni se guarda la nota, tampoco el motivo.</b> Solo se cuenta un premio más, y nadie más lo ve.</p>
  <div class="cr-g3"><button class="cr-o" data-p="1"><span>💪</span><b>Se ha esforzado</b></button><button class="cr-o" data-p="1"><span>📈</span><b>Ha mejorado</b></button><button class="cr-o" data-p="1"><span>🎓</span><b>Ha aprobado</b></button></div>
  <p id="cr-okm" class="cr-okm"></p><p><b>Premios dados: <span id="cr-n">${d.tickets}</span>.</b> Cada premio rellena las fichas. Con 1 se abre 🦄, con 3 🏍️ y con 6 🐉.</p>`);
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const k=gLoad(),q=datos(k);q.tickets++;q.nuevo++;k.fichas=G_FMAX;gSave(k);$('#cr-n').textContent=q.tickets;$('#cr-okm').textContent='Premio dado. Lo verá al volver a la carrera.';});}
}
menu();
window.__CIRC=CIRC;window.__VEH=VEH;window.__correr=correr;
})();
</script></body></html>
