<!doctype html>
<html lang="es">
<head><!--subcarpeta-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tema 2: Sistema operativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#1b56b8; --sky2:#4f93dc; --hill:#5da63a; --hill2:#3f8a2c;
  --title1:#0a5be0; --title2:#3f8ff5; --start:#3c9a3c; --bar:#1f55c4;
  --paper:#fffef8; --ink:#16233a; --soft:#566278; --line:#c9d4e6;
  --ok:#1f8a3a; --okbg:#dff5e3; --bad:#c9331f; --badbg:#fde5e0;
  --warn:#d96a00; --warnbg:#fff0d9; --sun:#ffcb2e; --tint:#eaf2ff;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-bottom:72px}
body{font-family:Lexend,Verdana,"Segoe UI",sans-serif;font-size:18px;line-height:1.5;color:var(--ink);
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 70%);min-height:100vh;padding-bottom:64px;overflow-x:hidden}
#hill{position:fixed;left:0;right:0;bottom:0;width:100%;height:42vh;z-index:0;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #ff9f1c;outline-offset:2px}
#app{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:16px}

/* Escritorio */
.today{background:var(--paper);border-radius:8px 8px 6px 6px;overflow:hidden;box-shadow:0 8px 24px rgba(10,40,100,.35);margin-bottom:20px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.icon{display:flex;flex-direction:column;align-items:center;background:none;border:0;border-radius:6px;padding:10px 6px;color:#fff;text-align:center;font-size:15px;line-height:1.25;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.6)}
.icon:hover{background:rgba(255,255,255,.2)}
.icon svg,.icon .pic{display:block;margin:0 auto 6px;width:52px;height:52px}
.icon .pic{font-size:42px;line-height:52px;text-shadow:none}
.meter{display:block;align-self:stretch;margin-top:auto!important;height:7px;background:rgba(255,255,255,.45);border-radius:4px;margin:6px 10px 0;overflow:hidden}
.meter i{display:block;height:100%;background:var(--sun)}
.icon.star{background:rgba(255,203,46,.28);outline:2px solid var(--sun)}
.icon.star:hover{background:rgba(255,203,46,.45)}
.pcitem{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:8px;padding:12px;margin-bottom:9px;font-size:17px}
.pcitem .b{flex:none;width:28px;height:28px;border:2px solid var(--title1);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;margin-top:2px}
.pcitem.on{background:var(--okbg);border-color:var(--ok)}
.pcitem.on .b{background:var(--ok);border-color:var(--ok)}
.pcitem small{display:block;font-size:16px;margin-top:3px}
#misframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:20;background:#e8eef6}
.deskhead{color:#fff;font-size:16px;margin:18px 4px 6px;text-shadow:0 1px 3px rgba(0,0,0,.7);font-weight:500}

/* Ventana */
.win{background:var(--paper);border-radius:8px 8px 6px 6px;box-shadow:0 10px 30px rgba(10,40,100,.4);overflow:hidden}
.tbar{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;color:#fff;font-family:"Trebuchet MS",Verdana,sans-serif;font-weight:700;font-size:16px;
  background:linear-gradient(180deg,var(--title2),var(--title1) 45%,#0848c4)}
.tbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:32px;height:28px;border:1px solid #fff;border-radius:4px;background:linear-gradient(180deg,#ec7a5f,#c9331f);color:#fff;font-weight:700;line-height:1;padding:0}
.say{height:28px;border:1px solid #fff;border-radius:4px;background:rgba(255,255,255,.18);color:#fff;font-size:14px;padding:0 8px}
.wbody{padding:22px}
.progress{height:10px;background:#dbe4f2;border-radius:5px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--start);transition:width .2s}
h1{font-size:28px;line-height:1.2;margin:0 0 10px}
h2{font-size:24px;line-height:1.25;margin:0 0 12px}
h3{font-size:18px;margin:18px 0 6px}
p{margin:0 0 10px}
.muted{color:var(--soft);font-size:16px}
.btn{display:inline-block;border:2px solid #7f9db9;background:linear-gradient(180deg,#fff,#e8eef8);border-radius:6px;padding:11px 18px;font-weight:500;margin:4px 8px 4px 0;min-height:48px}
.btn:hover{border-color:var(--title1)}
.btn.go{background:linear-gradient(180deg,#58b558,var(--start));border-color:#2a7a2a;color:#fff;font-weight:700;font-size:19px}
.row{margin-top:18px}

/* Tarjetas */
.big{font-size:21px;line-height:1.45}
.big ul{margin:6px 0;padding-left:24px}
.big li{margin-bottom:8px}
.key{display:inline-block;background:#fff;border:1px solid #93a3bb;border-bottom-width:3px;border-radius:5px;padding:0 8px;font-weight:700;font-size:.92em;white-space:nowrap}
.tip{background:var(--tint);border-left:6px solid var(--title1);padding:10px 14px;border-radius:4px;margin-top:14px;font-size:18px}
.do{background:#eaf7e6;border-left:6px solid var(--start);padding:12px 14px;border-radius:4px;margin-top:14px;font-size:19px}
.chg{display:inline-block;font-size:14px;font-weight:700;border-radius:4px;padding:1px 8px;margin-bottom:8px}
.chg.o{background:var(--warnbg);color:#a44f00}
.chg.r{background:var(--badbg);color:#a32412}

/* Test */
.q{font-size:23px;line-height:1.35;font-weight:500;margin-bottom:16px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;min-height:54px;font-size:18px}
.opt:hover:not(:disabled){border-color:var(--title1);background:var(--tint)}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);text-align:center;line-height:28px;font-size:15px}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.faded{opacity:.55}
.fb{border-radius:8px;padding:12px 14px;margin-top:6px;font-size:18px}
.fb.ok{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb strong{display:block;font-size:20px;margin-bottom:2px}
.xpnote{display:block;margin-top:6px;font-size:16px;color:var(--soft)}
.keys{color:var(--soft);font-size:14px;margin-top:10px}

/* Resultados y chuleta */
.score{font-size:64px;font-weight:700;line-height:1;margin:6px 0}
.miss{border-bottom:1px solid var(--line);padding:10px 0;font-size:17px}
.miss small{display:block;color:var(--ok);font-size:16px;font-weight:500}
table{border-collapse:collapse;width:100%;font-size:16px;margin:6px 0 16px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--tint)}
.swatch{font-weight:700;padding:0 4px}

/* Barra de tareas */
#task{position:fixed;left:0;right:0;bottom:0;height:54px;z-index:5;display:flex;align-items:center;gap:10px;color:#fff;
  background:linear-gradient(180deg,#3f7ee8,var(--bar) 25%,#1a48a8);border-top:1px solid #6d9df0}
#startb{height:100%;padding:0 18px 0 14px;border:0;border-radius:0 12px 12px 0;background:linear-gradient(180deg,#67bb5c,var(--start) 50%,#2c7d2c);color:#fff;font-family:"Trebuchet MS",Verdana,sans-serif;font-weight:700;font-style:italic;font-size:20px}
#stat{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tray{height:100%;display:flex;align-items:center;gap:4px;padding:0 10px;background:#0f8fdc;border-left:1px solid #082f7c}
#tray button{background:none;border:0;color:#fff;font-size:15px;padding:6px;border-radius:4px;white-space:nowrap}
#tray button:hover{background:rgba(255,255,255,.2)}

/* Menú contextual y descanso */
#ctx{position:fixed;z-index:9;background:#fff;border:1px solid #7a8aa3;box-shadow:3px 3px 8px rgba(0,0,0,.35);padding:12px 14px;width:260px;font-size:16px;border-radius:3px}
#modal{position:fixed;inset:0;z-index:8;background:rgba(10,30,80,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .win{max-width:480px;width:100%}
@media (max-width:560px){body{font-size:17px}.wbody{padding:16px}.big{font-size:19px}.q{font-size:20px}#stat{font-size:13px}#startb{font-size:17px;padding:0 12px 0 10px}.icons{grid-template-columns:repeat(3,1fr)}h1{font-size:24px}.say .sl{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{#task,#hill,.x,.say,.row{display:none!important}body{background:#fff;padding:0}.win{box-shadow:none}}

.av-svg{display:block;overflow:visible}
.av-banner{display:flex;gap:16px;align-items:center;background:#f1f4fb;border-radius:12px;padding:12px 16px;margin:12px 0;text-align:left}
.av-st{font-size:24px;font-weight:700;color:#17203a}
.av-new{font-size:19px;font-weight:700;color:#17783f}
.av-next{font-size:16px;color:#57617a}
#av-editor{position:fixed;inset:0;z-index:30;background:#dfe6f2;overflow:auto;padding:12px;font-family:Lexend,Verdana,"Segoe UI",sans-serif;color:#17203a}
.av-box{max-width:640px;margin:0 auto}
.av-head{position:sticky;top:-12px;background:#dfe6f2;padding:12px 0 6px;z-index:2;display:flex;gap:18px;align-items:center;justify-content:center;margin-bottom:10px}
.av-big{background:#fff;border-radius:14px;padding:10px 18px}
.av-time{font-size:17px;color:#57617a;margin-bottom:8px}
.av-done{font:inherit;font-weight:700;background:#3a3ca6;color:#fff;border:0;border-radius:10px;padding:10px 26px;font-size:19px;min-height:48px;cursor:pointer}
.av-tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.av-tabs button{font:inherit;font-size:16px;background:#fff;border:2px solid #c6d0e0;border-radius:9px;padding:7px 12px;min-height:42px;cursor:pointer;color:#17203a}
.av-tabs button.on{background:#3a3ca6;color:#fff;border-color:#3a3ca6}
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.av-opt{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#fff;border:3px solid #c6d0e0;border-radius:10px;padding:8px 4px;min-height:112px;cursor:pointer;color:#17203a}
.av-opt.on{border-color:#17783f;background:#dcf5e4}
.av-opt.lock{background:#eef1f6;cursor:default;color:#57617a}
.av-lock{font-size:30px}
.av-n{font-size:14px;line-height:1.2;text-align:center}
.av-out{text-align:center;padding-top:8vh}
.av-out .av-svg{margin:0 auto}
.av-out h2{font-size:26px;margin:14px 0 6px}
.av-out p{font-size:19px}
.av-home{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;margin-bottom:8px;font:inherit;cursor:pointer;color:inherit}
.av-home b{font-size:20px}
.icon .av-svg{margin:0 auto 6px}

.av-pal{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;margin-bottom:10px;background:#fff;border-radius:10px;padding:8px}
.av-pal button{aspect-ratio:1;border:0;border-radius:3px;padding:0;cursor:pointer;min-width:0}
.av-pal button.on{outline:3px solid #17203a;outline-offset:1px}
#lg{position:fixed;inset:0;z-index:30;background:#dfe6f2;overflow:auto;padding:12px;font-family:Lexend,Verdana,"Segoe UI",sans-serif;font-size:18px;line-height:1.4;color:#17203a}
.lg-box{max-width:640px;margin:0 auto;padding-bottom:30px}
.lg-box h2{font-size:26px;margin:8px 0 12px}.lg-box h3{font-size:20px;margin:18px 0 4px}
.lg-x,.lg-del{font:inherit;background:none;border:0;color:#57617a;text-decoration:underline;font-size:16px;padding:8px 2px;cursor:pointer}
.lg-del{display:block;margin:20px auto 0}
.lg-s{font-size:15px;color:#57617a;margin:0 0 6px}
.lg-l{display:block;margin:10px 0;font-weight:500}.lg-l input{display:block;width:100%;font:inherit;font-size:20px;padding:11px;border:2px solid #c6d0e0;border-radius:10px;margin-top:4px}
.lg-ck{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:17px}.lg-ck input{width:22px;height:22px;flex:none;margin-top:2px}
.lg-err{color:#9a5200;font-weight:500;min-height:1.3em;font-size:16px}
.lg-go{font:inherit;font-weight:700;display:block;width:100%;background:#3a3ca6;color:#fff;border:0;border-radius:12px;padding:14px;font-size:21px;min-height:58px;cursor:pointer;margin-top:10px}
.lg-top{display:flex;justify-content:space-between;align-items:center}.lg-me{display:flex;gap:10px;align-items:center;text-align:left}
.lg-reto{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff0d6;border-radius:12px;padding:12px;margin-top:8px}
.lg-ts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lg-t{background:#fff;border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font-size:16px}.lg-te{font-size:36px;line-height:1.1}
.lg-mini{font:inherit;font-weight:700;font-size:15px;background:#3a3ca6;color:#fff;border:0;border-radius:9px;padding:8px 12px;min-height:40px;cursor:pointer;flex:none}
.lg-tabs{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.lg-tabs button{font:inherit;font-size:15px;background:#fff;border:2px solid #c6d0e0;border-radius:9px;padding:6px 10px;min-height:40px;cursor:pointer;color:#17203a}.lg-tabs button.on{background:#3a3ca6;color:#fff;border-color:#3a3ca6}
.lg-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:6px 10px;margin-top:5px;font-size:17px}.lg-row.me{outline:3px solid #3a3ca6}.lg-pos{width:24px;text-align:center;font-weight:700;color:#57617a}.lg-name{flex:1;min-width:0;overflow-wrap:anywhere}
.lg-q{font-size:25px;font-weight:500;line-height:1.25;margin:6px 0 16px}.lg-q b{color:#3a3ca6}
.lg-opt{display:block;width:100%;text-align:left;font:inherit;font-size:19px;background:#fff;border:3px solid #c6d0e0;border-radius:12px;padding:13px;margin-bottom:9px;min-height:58px;cursor:pointer;color:#17203a}.lg-opt.ok{background:#dcf5e4;border-color:#17783f}.lg-opt.no{background:#fff0d6;border-color:#9a5200}
.lg-end{text-align:center;padding-top:10vh}

.av-tr{font-size:16px;margin:12px 0 5px}.av-tr small{color:#57617a;font-weight:400}
.av-prem{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.av-pr{font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:3px solid #c6d0e0;border-radius:10px;padding:6px 2px;min-height:78px;cursor:pointer;color:#17203a}
.av-pr span{font-size:28px;line-height:1.1}.av-pr small{font-size:12px;line-height:1.15;text-align:center}
.av-pr.on{border-color:#17783f;background:#dcf5e4}.av-pr.lock{background:#eef1f6;color:#57617a;cursor:default}
#jg{position:fixed;inset:0;z-index:30;background:#dfe6f2;overflow:auto;padding:12px;font-family:Lexend,Verdana,"Segoe UI",sans-serif;font-size:18px;line-height:1.4;color:#17203a}
.jg-box{position:relative;max-width:820px;margin:0 auto}
.jg-box h2{font-size:30px;margin:6px 0 10px}
.jg-hero{display:flex;gap:16px;align-items:center;margin:8px 0 12px}
.jg-k{display:inline-block;font:inherit;font-weight:700;font-size:.9em;background:#fff;border:2px solid #8391ab;border-bottom-width:4px;border-radius:7px;padding:0 8px}
.jg-empty{background:#fff0d6;border-radius:12px;padding:14px;margin-top:10px}
.jg-score{display:flex;justify-content:space-between;align-items:baseline;font-size:30px;font-weight:700;margin-bottom:6px}
.jg-best{font-size:16px;font-weight:400;color:#57617a}
#jg-c{display:block;width:100%;height:auto;border-radius:12px;touch-action:none;user-select:none;cursor:pointer}
.jg-hint{font-size:16px;color:#57617a;text-align:center;margin:8px 0}
.jg-over{background:#fff;border-radius:14px;padding:14px 18px;margin-top:10px;text-align:center}.jg-over h2{margin:0}.jg-over p{margin:6px 0}

.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-weight:500}.frac i{font-style:normal;padding:0 3px}.frac i:first-child{border-bottom:2px solid currentColor}
</style>

function pickVar(base){
  if(base.gen){const r=base.gen();return Object.assign({id:base.id,b:base.b,c:base.c},r);}
  const vs=VAR[String(base.id)];
  if(!vs||!vs.length)return base;
  const i=Math.floor(Math.random()*(vs.length+1));
  if(i===vs.length)return base;
  const c=vs[i];
  return {id:base.id,b:base.b,c:base.c,n:base.n,q:c[0],a:c[1],w:c.slice(2)};
}

function reviewPick(i){

  if(w.length)return pick(w);

  return pool.length?pick(pool):null;

function startMission(i){

  R={kind:'mission',i,queue:[...(rv?[{id:rv,rev:true}]:[]),...qs.map(id=>({id}))],pos:0,first:0,total:qs.length+(rv?1:0),tries:{},fixed:0};

}
function startReview(){
  const ids=shuffle(wrongIds()).slice(0,5);
  R={kind:'review',queue:ids.map(id=>({id,rev:true})),pos:0,total:ids.length,tries:{},fixed:0};showQ();
}
function showQ(){
  clearAll();
  if(R.pos>=R.queue.length)return R.kind==='mission'?afterMission():afterReview();
  const it=R.queue[R.pos],q=(it.rev||it.again)?pickVar(byId[it.id]):byId[it.id];window.CURQ=q;
  const wr=q.w.length<=1?q.w:shuffle(q.w).slice(0,2);
  const t0=Date.now(),opts=gOrden(q.a,wr,it.id);
  const pct=Math.round(R.pos/R.queue.length*100);
  const tag=it.rev&&R.kind==='mission'?'<div class="tag">Una de repaso</div>':it.again?'<div class="tag">Otra vez, ahora sale</div>':'';
  shell(`${tag}<div class="q">${fmt(q.q)}</div><div class="opts" id="opts"></div><div id="fb"></div>`,{pct,say:q.q+' '+opts.map((o,i)=>`${i+1}: ${o}`).join('. ')});
  let done=false;
  const answer=k=>{
    if(done)return;done=true;
    const right=opts[k]===q.a;gNota(right);
    document.querySelectorAll('.opt').forEach((b,x)=>{b.disabled=true;if(opts[x]===q.a)b.classList.add('ok');else if(x===k)b.classList.add('no');else b.classList.add('fade');});
    ding(right);
    if(right){
      if(it.rev)delete S.wrong[it.id];
      gCorrect(it.id==+it.id?+it.id:it.id);if(!it.again)gAward(1);
      if(it.again)R.fixed++;
      save();
      const fb=document.getElementById('fb');fb.innerHTML=`<div class="fb ok" role="status"><strong>${pick(RIGHT)}</strong>${q.n?(typeof gF==='function'?gF(q.n):q.n):''}</div>`;
      const nx=gSig(fb,t0,()=>{R.pos++;showQ();});keyH=e=>{if(e.key==='Enter'){e.preventDefault();nx();}};
    }else{
      S.wrong[it.id]=true;save();
      if((R.tries[it.id]||0)<2){R.tries[it.id]=(R.tries[it.id]||0)+1;R.queue.push({id:it.id,again:true,rev:it.rev});}
      const fb=document.getElementById('fb');fb.innerHTML=`<div class="fb no" role="status"><strong>Es la verde.</strong>${q.n}</div>`;
      const nx=gSig(fb,t0,()=>{R.pos++;showQ();});
      keyH=e=>{if(e.key==='Enter'){e.preventDefault();nx();}};
    }
  };
  later(()=>{
    document.getElementById('opts').innerHTML=opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="n">${i+1}</span><span>${o}</span></button>`).join('');
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
    keyH=e=>{const n=+e.key;if(n>=1&&n<=opts.length){e.preventDefault();answer(n-1);}};
  },OPT_DELAY);
}

function pickVar(base){
  if(base.gen){const r=base.gen();return Object.assign({id:base.id,b:base.b,c:base.c},r);}
  const vs=VAR[String(base.id)];
  if(!vs||!vs.length)return base;
  const i=Math.floor(Math.random()*(vs.length+1));
  if(i===vs.length)return base;
  const c=vs[i];
  return {id:base.id,b:base.b,c:base.c,n:base.n,q:c[0],a:c[1],w:c.slice(2)};
}

const G_FMAX=3,G_FPASO=2*3600*1000,G_FESP=3600*1000;
function gGana(g){if(g.fBloq&&Date.now()<g.fBloq)g.fRes=Math.min(G_FMAX,(g.fRes||0)+1);else g.fichas=Math.min(G_FMAX,g.fichas+1);}
function gFichas(g){const now=Date.now();if(g.prueba){g.fichas=G_FMAX;g.fBloq=0;g.fRes=0;return g;}if(g.fichas>G_FMAX)g.fichas=G_FMAX;if(g.fichas<=0&&!g.fBloq){g.fichas=0;g.fBloq=now+G_FESP;g.fRes=0;gSave(g);}if(g.fBloq){if(now<g.fBloq)return g;g.fichas=Math.min(G_FMAX,Math.max(1,g.fRes||0));g.fBloq=0;g.fRes=0;g.fichaT=now;gSave(g);}if(g.fichas>=G_FMAX){g.fichaT=now;return g;}if(!g.fichaT)g.fichaT=now;const n=Math.floor((now-g.fichaT)/G_FPASO);if(n>0){g.fichas=Math.min(G_FMAX,g.fichas+n);g.fichaT=g.fichas>=G_FMAX?now:g.fichaT+n*G_FPASO;}return g;}

 {id:'basic',name:'Conceptos básicos',cards:[
  {t:'¿Qué es Windows?',h:`<ul><li>Es un <b>sistema operativo</b>: hace funcionar el ordenador y te deja usarlo.</li><li>Es <b>de interfaz gráfica</b>: usas ventanas e iconos con el ratón.</li><li>Desde el <b>menú Inicio</b> llegas a todo el sistema.</li></ul>`},
  {t:'Ventanas',h:`<ul><li><b>Minimizas</b> una ventana y la recuperas desde la <b>barra de tareas</b>.</li><li><span class="key">ALT</span> + <span class="key">TAB</span> pasa de una ventana a otra.</li><li><b>Mostrar escritorio</b> baja todas las ventanas de golpe (<span class="key">Win</span> + <span class="key">D</span>).</li><li>Para ver varias a la vez: arrástralas a los bordes o usa <span class="key">Win</span> + <span class="key">Z</span> en Windows 11.</li></ul>`},
  {t:'El botón derecho',h:`<ul><li>Clic con el <b>botón derecho</b> = aparece el <b>menú contextual</b>.</li><li>Botón derecho en el escritorio: <b>personalizar</b> y <b>configuración de pantalla</b>.</li></ul><div class="tip">Truco: cuando dudes en el examen, muchas respuestas empiezan por «botón derecho».</div>`},
  {t:'Accesos directos',h:`<ul><li>Un <b>acceso directo</b> es una forma rápida de abrir un programa.</li><li>Tiene una flechita en una esquina del icono.</li><li>El de <b>inicio rápido</b>, en la barra de tareas, se abre con <b>un solo clic</b>. El del escritorio, con doble clic.</li></ul>`},
  {t:'Datos sueltos',h:`<ul><li><span class="key">CTRL</span> + <span class="key">ALT</span> + <span class="key">SUPR</span>: administrador de tareas.</li><li><span class="key">F1</span> en el escritorio: ayuda de Windows.</li><li><b>ClearType</b>: mejora la lectura en pantalla.</li><li><b>Documentos</b> (Mis documentos): una carpeta de cada usuario.</li></ul>`,
   try:'Clic derecho en un sitio vacío del escritorio. Eso que sale es el menú contextual. Luego prueba ALT + TAB.'}
 ]},
 {id:'expl',name:'El Explorador',cards:[
  {t:'Cómo se ve',h:`<ul><li>Tiene dos zonas: <b>árbol</b> a la izquierda y <b>contenido</b> a la derecha.</li><li><b>Mi PC</b> ahora se llama <b>Este equipo</b>: ahí están todas las unidades.</li><li>El signo <b>+</b> (hoy una flechita ›) = hay más carpetas dentro.</li><li><b>Vista de detalle</b>: extensión, fecha, tamaño…</li></ul>`},
  {t:'Seleccionar',h:`<ul><li>Seguidos: clic en el primero y <span class="key">MAYÚS</span> + clic en el último.</li><li>Saltados: clic en el primero y <span class="key">CTRL</span> + clic en los demás.</li><li>Todos: <span class="key">CTRL</span> + <span class="key">E</span> (si en tu ordenador no va, <span class="key">CTRL</span> + <span class="key">A</span>).</li></ul>`},
  {t:'Cortar, copiar, pegar',h:`<ul><li><span class="key">CTRL</span> + <span class="key">X</span> cortar (parece unas tijeras).</li><li><span class="key">CTRL</span> + <span class="key">C</span> copiar (C de Copiar).</li><li><span class="key">CTRL</span> + <span class="key">V</span> pegar (está al lado).</li></ul><div class="tip">También con botón derecho → cortar, copiar o pegar.</div>`},
  {t:'Pendrive y carpetas',h:`<p>Todo empieza con <b>botón derecho en la unidad</b>:</p><ul><li>Formatear: menú → <b>formatear</b>.</li><li>Crear carpeta: menú → <b>nuevo, carpeta</b>.</li><li>Ver el espacio libre: menú → <b>propiedades</b>.</li></ul>`},
  {t:'Extensiones de archivo',h:`<ul><li>La <b>extensión</b> dice qué tipo de archivo es y con qué programa se abre.</li><li><b>.EXE</b> = ejecutable.</li><li>Imagen: <b>jpg, bmp</b>. Texto: <b>doc, odt</b>. Comprimidos: <b>rar, zip</b>.</li><li>Para verlas: Explorador → <b>Ver</b> → Mostrar → <b>Extensiones de nombre de archivo</b>.</li></ul>`},
  {t:'Buscar y abrir',h:`<ul><li>Buscar un archivo: <b>Inicio / buscar</b>.</li><li>¿Se puede hacer que las carpetas se abran con un solo clic? <b>Verdadero.</b></li></ul>`,
   try:'Abre el Explorador (Win + E), selecciona varios archivos con CTRL y activa las extensiones de nombre de archivo.'}
 ]},
 {id:'mipc',name:'Mi PC',cards:[
  {t:'Mi PC (Este equipo)',h:`<ul><li>Desde <b>Este equipo</b> accedes a todas las unidades.</li><li>Al eliminar un archivo, <b>no siempre</b> se puede recuperar de la papelera.</li><li>Ocultar una carpeta: botón derecho → ficha <b>propiedades</b> → <b>oculto</b>.</li></ul>`,
   try:'Abre Este equipo y mira cuántas unidades tienes. Crea una carpeta de prueba y entra en sus propiedades.'}
 ]},
 {id:'pap',name:'Papelera de reciclaje',cards:[
  {t:'La papelera',h:`<ul><li>Lo que está en la papelera <b>sigue ocupando espacio</b> en el disco.</li><li>Recuperar: seleccionar y <b>restaurar</b>.</li><li>Vaciar: botón derecho → <b>vaciar papelera de reciclaje</b>.</li><li>Propiedades: botón derecho → <b>propiedades</b>.</li><li>Elegir el tamaño: propiedades → <b>selector de tamaño</b>.</li></ul>`,
   try:'Borra un archivo de prueba, entra en la papelera y restáuralo.'}
 ]},
 {id:'cuen',name:'Cuentas de usuario',cards:[
  {t:'Tipos de cuenta',h:`<ul><li><b>Administrador</b>: puede con todo el sistema y cambia la configuración.</li><li><b>Estándar</b> (en los apuntes, <b>limitada</b>): usa casi todos los programas, pero <b>no instala</b> hardware ni software.</li><li><b>Invitado</b>: estaba en XP. En Windows 10 y 11 ya no está.</li></ul>`},
  {t:'Cada uno lo suyo',h:`<ul><li>Cada usuario tiene su <b>escritorio, menú Inicio, Documentos y descargas</b>.</li><li>Cambiar de usuario: <b>Inicio → cerrar sesión</b> y escoger.</li></ul>`,
   try:'Abre Inicio y haz clic en tu nombre de usuario. Mira qué opciones aparecen, sin cerrar nada.'}
 ]},
 {id:'ini',name:'Personalizar menú Inicio',cards:[
  {t:'Menú Inicio',h:`<ul><li>Si borras un icono del menú Inicio, <b>no borras el programa</b>, solo su acceso directo.</li><li>Acceso directo en el escritorio: busca el programa en Inicio, <b>botón derecho → Abrir ubicación de archivo</b>, y otra vez botón derecho → <b>Enviar a → Escritorio</b>.</li></ul><div class="tip">En Windows 11 también puedes arrastrarlo desde «Todas» hasta el escritorio.</div>`,
   try:'Crea en el escritorio un acceso directo a Mapa de caracteres.'}
 ]},
 {id:'panel',name:'Panel de control',cards:[
  {t:'Abrirlo',h:`<ul><li>En XP: Inicio → Panel de control.</li><li>En Windows 10 y 11: escribe <b>«panel de control»</b> en el buscador de Inicio.</li></ul>`},
  {t:'Para qué sirve',h:`<ul><li><b>Desinstalar</b>: agregar o quitar programas (hoy, Programas y características).</li><li><b>Fecha y hora</b>: también desde el reloj de la barra de tareas.</li><li>Teclado raro, sin eñe ni acentos: <b>configuración regional y de idioma</b>.</li><li>Ver o instalar letras: <b>fuentes</b>.</li></ul>`,
   try:'Abre el Panel de control y encuentra Fuentes.'}
 ]},
 {id:'acc',name:'Accesorios',cards:[
  {t:'Programas pequeños',h:`<ul><li><b>Paint</b>: imágenes de mapa de bits.</li><li><b>Calculadora</b>: su ventaja es pasar resultados a otro programa con copiar-pegar. Modos: <b>estándar, científica, gráfica, programador y fechas</b>.</li><li><b>Mapa de caracteres</b>: lo buscas en Inicio y copias y pegas el símbolo.</li></ul>`},
  {t:'Mantenimiento del disco',h:`<ul><li><b>Desfragmentador</b>: organiza los archivos y el espacio no usado.</li><li><b>Liberador de espacio</b>: borra temporales, papelera…</li><li><b>Scandisk / comprobar errores</b>: botón derecho en la unidad → propiedades → herramientas → comprobar.</li></ul>`},
  {t:'Información y rescate',h:`<ul><li>Saber procesador y memoria RAM: botón derecho en <b>Este equipo</b> → propiedades.</li><li><b>Restaurar sistema</b>: vuelve el equipo a una situación anterior <b>sin perder datos</b> como tus documentos.</li></ul>`,
   try:'Abre la Calculadora y pasa de estándar a científica. Luego abre Mapa de caracteres desde el buscador.'}
 ]},
 {id:'extra',name:'Extra: del manual',extra:true,cards:[
  {t:'Ratón y ventanas',h:`<ul><li><b>Clic</b>: selecciona. <b>Doble clic</b>: abre. <b>Arrastrar</b>: mueve.</li><li><span class="key">ALT</span> + <span class="key">F4</span> cierra la ventana activa.</li><li>Doble clic en la barra de título: maximiza.</li></ul>`},
  {t:'Archivos',h:`<ul><li><span class="key">F2</span>: cambiar el nombre.</li><li><span class="key">SUPR</span>: a la papelera. <span class="key">MAYÚS</span> + <span class="key">SUPR</span>: borrado directo.</li><li><b>Portapapeles</b>: memoria temporal de lo copiado. Se puede pegar muchas veces.</li><li>1 KB = 1024 bytes. 1 MB = 1024 KB. 1 GB = 1024 MB.</li></ul>`},
  {t:'Otros sistemas operativos',h:`<p>Windows no es el único. En la web del profe están <b>Trisquel, Galinux, Ubuntu y Knoppix</b>: todos son <b>GNU/Linux</b>.</p><div class="tip">No entra en las 63 preguntas: es una curiosidad.</div>`}
 ]}
];

const Q=[
 {id:1,b:'basic',c:'g',q:'La barra de inicio rápido…',a:'Está en la barra de tareas.',w:['Está dentro de Mi PC.','Está en el Panel de control.','Solo aparece al pulsar F1.'],n:'Hoy son los iconos anclados a la barra de tareas.'},
 {id:2,b:'basic',c:'g',q:'Windows es un sistema operativo…',a:'De interfaz gráfica.',w:['Solo de texto.','Sin ventanas.','Que solo funciona con teclado.'],n:'Gráfica = ventanas e iconos que usas con el ratón.'},
 {id:3,b:'basic',c:'o',q:'Desde el menú Inicio…',a:'Podemos acceder a todo el sistema.',w:['Solo podemos apagar el ordenador.','Solo podemos ver la hora.','Solo se abre la papelera.'],n:'En Windows actual es el botón con el logo de Windows.'},
 {id:4,b:'basic',c:'g',q:'Cuando minimizamos una ventana…',a:'La podemos recuperar desde la barra de tareas.',w:['Se cierra y se pierde.','Se recupera desde la papelera.','Solo se recupera reiniciando.'],n:'Minimizar no cierra: la ventana queda en la barra de tareas.'},
 {id:5,b:'basic',c:'g',q:'El menú contextual aparece…',a:'Al hacer clic con el botón derecho.',w:['Al hacer doble clic con el izquierdo.','Al pulsar F1.','Al cerrar una ventana.'],n:'Botón derecho = menú contextual.'},
 {id:6,b:'basic',c:'g',q:'Un icono de acceso directo es…',a:'Una forma rápida de ejecutar un programa.',w:['Una copia completa del programa.','Un archivo de la papelera.','Una carpeta de cada usuario.'],n:'Es un atajo: si lo borras, el programa sigue ahí.'},
 {id:7,b:'basic',c:'o',q:'La combinación de teclas ALT + TAB…',a:'Permite pasar de una ventana a otra.',w:['Cierra todas las ventanas.','Abre el administrador de tareas.','Copia lo seleccionado.'],n:'Mantén ALT y ve pulsando TAB.'},
 {id:8,b:'basic',c:'r',q:'Si quieres tener visibles a la vez todas las ventanas…',a:'Las ajustas: botón derecho en la barra (Win 10), o las arrastras a los bordes (Win 11).',w:['Pulsas F1 y eliges cada ventana en la lista que aparece en la ayuda de Windows.','Las minimizas todas desde el Panel de control, en la opción de fecha y hora.','Las copias con CTRL + C y las vas pegando una a una sobre el escritorio.'],n:'Windows 10: Mostrar ventanas en paralelo. Windows 11: también con Windows + Z.'},
 {id:9,b:'basic',c:'r',q:'El icono «Mostrar escritorio»…',a:'Minimiza todas las ventanas de golpe y muestra el escritorio.',w:['Abre el Panel de control.','Cierra todos los programas y los borra.','Cambia el fondo de pantalla.'],n:'Hoy está en la esquina derecha de la barra de tareas. Atajo: Win + D.',xp:'En XP era un icono de la barra de inicio rápido.'},
 {id:10,b:'basic',c:'g',q:'La diferencia entre un acceso directo y un icono de inicio rápido es que…',a:'El de inicio rápido se abre con un solo clic.',w:['El de inicio rápido no se puede borrar.','El acceso directo se abre con tres clics.','El de inicio rápido solo abre carpetas.'],n:'Inicio rápido: 1 clic. Escritorio: doble clic.'},
 {id:11,b:'basic',c:'g',q:'Para personalizar el escritorio…',a:'Hacemos clic con el botón derecho en él.',w:['Pulsamos CTRL + E.','Vamos a la papelera.','Hacemos doble clic en el reloj.'],n:'Windows 10 y 11: botón derecho → Personalizar.'},
 {id:12,b:'basic',c:'r',q:'Para configurar las propiedades de la pantalla…',a:'Botón derecho en el escritorio y Configuración de pantalla.',w:['Doble clic en la papelera y Restaurar.','CTRL + ALT + SUPR y Finalizar tarea.','Botón derecho en un pendrive y Formatear.'],n:'Sigue empezando con botón derecho en el escritorio.',xp:'En XP: botón derecho en el escritorio → Propiedades.'},
 {id:13,b:'basic',c:'g',q:'Para mejorar la lectura en pantalla se escoge…',a:'ClearType.',w:['Paint.','Scandisk.','Mapa de caracteres.'],n:'ClearType suaviza las letras.'},
 {id:14,b:'basic',c:'g',q:'Mis documentos es una carpeta…',a:'De cada usuario.',w:['Común para todo el mundo.','Solo del administrador.','Que está dentro de la papelera.'],n:'Hoy se llama Documentos, pero sigue siendo de cada usuario.'},
 {id:15,b:'basic',c:'g',q:'Abrimos el administrador de tareas haciendo…',a:'CTRL + ALT + SUPR',w:['CTRL + ALT + C','ALT + TAB + F1','CTRL + MAYÚS + E'],n:'Luego eliges Administrador de tareas. En Windows actual también va directo con CTRL + MAYÚS + ESC.'},
 {id:16,b:'basic',c:'g',q:'Si estamos en el escritorio y pulsamos F1…',a:'Nos sale la ayuda de Windows.',w:['Se apaga el ordenador.','Se abre el Explorador.','Se vacía la papelera.'],n:'F1 = ayuda.'},

 {id:17,b:'expl',c:'g',q:'En el Explorador tengo…',a:'Una zona de árbol y otra de contenido.',w:['Solo una lista de programas.','Una zona de dibujo y otra de colores.','Una calculadora y un reloj.'],n:'Árbol a la izquierda, contenido a la derecha.'},
 {id:18,b:'expl',c:'r',q:'Desde Mi PC (Este equipo)…',a:'Accedo a todas las unidades.',w:['Solo accedo a la papelera.','Solo veo la hora.','Solo cambio el fondo de pantalla.'],n:'Mi PC ahora se llama Este equipo.'},
 {id:19,b:'expl',c:'o',q:'Un signo «+» (hoy, una flechita) al lado de una carpeta…',a:'Significa que hay más carpetas en su interior.',w:['Significa que está en la papelera.','Significa que es de otro usuario.','Significa que está oculta.'],n:'En Windows actual suele verse como una flechita.'},
 {id:20,b:'expl',c:'g',q:'Con la vista de detalle…',a:'Se muestran la extensión, la fecha, el tamaño…',w:['Solo se ven iconos grandes sin datos.','Se abren todas las imágenes.','Se borran los archivos viejos.'],n:'Detalle = datos de cada archivo.'},
 {id:21,b:'expl',c:'g',q:'Para formatear un pendrive…',a:'Botón derecho en la unidad, y en el menú contextual: formatear.',w:['Doble clic en la papelera, y en el menú contextual: vaciar.','CTRL + X en la unidad, y luego pegar en el escritorio.','Desde el Panel de control, en la opción de fuentes.'],n:'Formatear borra todo lo que hay dentro.'},
 {id:22,b:'expl',c:'g',q:'Para crear una carpeta…',a:'Botón derecho en la unidad, y en el menú contextual: nuevo, carpeta.',w:['CTRL + V en el escritorio, y en el menú: pegar carpeta.','Inicio, y en el menú contextual: apagar el equipo.','Doble clic en la barra de tareas, y luego: mosaico.'],n:'Botón derecho → Nuevo → Carpeta.'},
 {id:23,b:'expl',c:'g',q:'Para seleccionar varios objetos continuos…',a:'Clic en el primero y MAYÚS + clic en el último.',w:['Clic en el primero y CTRL + clic en los demás.','Doble clic en cada uno.','ALT + TAB en el primero.'],n:'Continuos = seguidos = MAYÚS.'},
 {id:24,b:'expl',c:'g',q:'Para seleccionar varios objetos no continuos…',a:'Clic en el primero y CTRL + clic en los demás.',w:['Clic en el primero y MAYÚS + clic en el último.','CTRL + V en el primero.','Botón derecho y formatear.'],n:'No continuos = saltados = CTRL.'},
 {id:25,b:'expl',c:'g',q:'Para seleccionar todos los objetos…',a:'CTRL + E',w:['CTRL + X','CTRL + V','ALT + TAB'],n:'E de Entero. Si en tu ordenador no funciona, prueba CTRL + A, pero en los apuntes es CTRL + E.'},
 {id:26,b:'expl',c:'g',q:'Para cortar objetos…',a:'CTRL + X o botón derecho, cortar.',w:['CTRL + C o botón derecho, copiar.','CTRL + V o botón derecho, pegar.','CTRL + E o botón derecho, eliminar.'],n:'La X parece unas tijeras.'},
 {id:27,b:'expl',c:'g',q:'Para copiar objetos…',a:'CTRL + C o botón derecho, copiar.',w:['CTRL + X o botón derecho, cortar.','CTRL + V o botón derecho, pegar.','ALT + C o botón derecho, propiedades.'],n:'C de Copiar.'},
 {id:28,b:'expl',c:'g',q:'Para pegar objetos…',a:'CTRL + V o botón derecho, pegar.',w:['CTRL + C o botón derecho, copiar.','CTRL + X o botón derecho, cortar.','CTRL + P o botón derecho, propiedades.'],n:'La V está al lado de la C y la X.'},
 {id:29,b:'expl',c:'r',q:'Para visualizar las extensiones de los ficheros…',a:'En el Explorador: Ver, Mostrar y Extensiones de nombre de archivo.',w:['En la papelera: Restaurar y Propiedades.','En el Panel de control: Fecha y hora.','Pulsando CTRL + ALT + SUPR y Finalizar tarea.'],n:'En Windows 10 es la casilla de la pestaña Vista.',xp:'En XP: menú Herramientas / opciones de carpeta / ver, y desactivar ocultar extensiones.'},
 {id:30,b:'expl',c:'g',q:'La extensión de un archivo…',a:'Indica qué tipo es y con qué programa se abre.',w:['Indica quién lo creó.','Indica cuántas veces se ha abierto.','Indica si está en la papelera.'],n:'foto.jpg: la extensión es jpg.'},
 {id:31,b:'expl',c:'g',q:'Un archivo ejecutable es el que tiene extensión…',a:'EXE',w:['JPG','DOC','ZIP'],n:'EXE viene de ejecutar.'},
 {id:32,b:'expl',c:'g',q:'Para buscar un archivo…',a:'Vamos a Inicio / buscar.',w:['Vamos a la calculadora.','Pulsamos ALT + TAB.','Vamos a Paint.'],n:'Hoy basta con empezar a escribir tras abrir Inicio.'},
 {id:33,b:'expl',c:'g',q:'Para ver el tamaño disponible en un pendrive…',a:'Botón derecho en la unidad, y en el menú contextual: propiedades.',w:['Botón derecho en la unidad, y en el menú contextual: formatear.','Doble clic en la papelera, y en el menú contextual: vaciar.','Desde el Panel de control, en la opción de fecha y hora.'],n:'Cuidado: formatear lo borraría todo.'},
 {id:34,b:'expl',c:'g',q:'Se puede hacer que las carpetas se abran con un solo clic.',a:'Verdadero',w:['Falso'],n:'Se elige en las opciones de carpeta.'},

 {id:35,b:'mipc',c:'r',q:'Desde Mi PC (Este equipo)…',a:'Podemos acceder a todas las unidades.',w:['Solo podemos abrir Paint.','Solo podemos vaciar la papelera.','Solo podemos cerrar sesión.'],n:'Sale dos veces en los apuntes: Mi PC es hoy Este equipo.'},
 {id:36,b:'mipc',c:'g',q:'Al eliminar un archivo…',a:'No siempre lo puedo recuperar en la papelera de reciclaje.',w:['Siempre lo puedo recuperar en la papelera de reciclaje.','Se envía al escritorio como un acceso directo nuevo.','Se guarda en la carpeta Documentos de cada usuario.'],n:'Por ejemplo, con MAYÚS + SUPR no pasa por la papelera.'},
 {id:37,b:'mipc',c:'g',q:'Cómo se puede ocultar una carpeta…',a:'Botón derecho sobre ella, ficha propiedades, oculto.',w:['Doble clic sobre ella, botón minimizar, y cerrar la ventana.','CTRL + X sobre ella, y pegarla en la papelera de reciclaje.','Desde el Panel de control, en la opción de fuentes.'],n:'Oculto es una casilla de sus propiedades.'},

 {id:38,b:'pap',c:'g',q:'Para recuperar un archivo desde la papelera de reciclaje…',a:'Lo seleccionamos y le damos a restaurar.',w:['Lo seleccionamos y le damos a vaciar.','Pulsamos F1.','Formateamos el disco.'],n:'Restaurar lo devuelve a su sitio.'},
 {id:39,b:'pap',c:'g',q:'Los objetos que están en la papelera de reciclaje…',a:'Siguen ocupando espacio en el disco duro.',w:['Ya no ocupan nada.','Están en la memoria RAM.','Se borran solos al apagar.'],n:'Hasta que la vacías, siguen ocupando.'},
 {id:40,b:'pap',c:'g',q:'Para vaciar la papelera de reciclaje…',a:'Botón derecho, vaciar papelera de reciclaje.',w:['Doble clic, restaurar.','CTRL + V sobre ella.','Inicio, panel de control, fuentes.'],n:'Vaciar = borrar de verdad.'},
 {id:41,b:'pap',c:'g',q:'Para ver las propiedades de la papelera de reciclaje…',a:'Botón derecho encima de ella y luego propiedades.',w:['Pulsando F1 en el escritorio y buscando en la ayuda.','Pulsando ALT + TAB y abriendo la ventana de la papelera.','Doble clic encima de ella y luego el botón restaurar.'],n:'Propiedades casi siempre es con botón derecho.'},
 {id:42,b:'pap',c:'g',q:'Cómo se escoge el tamaño de la papelera de reciclaje…',a:'Botón derecho encima de ella, propiedades, selector de tamaño.',w:['Formateando el disco duro y eligiendo el tamaño de la unidad.','Abriendo el Explorador y usando la vista de detalle.','Abriendo Paint y cambiando la anchura en el menú Imagen.'],n:'En propiedades eliges cuánto puede ocupar.'},

 {id:43,b:'cuen',c:'o',q:'Qué tipos de cuentas hay en Windows 10 y 11…',a:'Administrador y estándar.',w:['Profesor y alumno.','Pública y privada.','Rápida y lenta.'],n:'Los apuntes de XP decían administrador, limitada e invitado. La limitada es hoy la estándar, y la de invitado ya no está.'},

/* ===== ESTADO ===== */
const KEY='tema2so.v1';
let S={st:{},seen:{},wrong:{},xp:0,best:null,snd:true};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}

const app=document.getElementById('app');

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const mastered=q=>(S.st[q.id]||0)>=2;
const qsOf=b=>Q.filter(x=>x.b===b);
const doneOf=b=>qsOf(b).filter(mastered).length;
const totalDone=()=>OFFICIAL.filter(mastered).length;
const wrongList=()=>Object.keys(S.wrong).filter(k=>byId[k]);

function stat(){
  const n=totalDone();
  document.getElementById('stat').textContent=`${n} de 63 dominadas  ·  ⭐ ${gStars()}`;
  document.getElementById('snd').textContent=S.snd?'🔔':'🔕';
  document.getElementById('snd').setAttribute('aria-label',S.snd?'Quitar sonido':'Poner sonido');
}
function ding(ok){
  if(!S.snd)return;
  try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=ok?880:220;g.gain.value=.08;
    o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(ok?.25:.3));o.stop(c.currentTime+.32);}catch(e){}
}
function speak(t){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,' ').replace(/\s\+\s/g,' más '));u.lang='es-ES';u.rate=.95;speechSynthesis.speak(u);}catch(e){}
}
function win(title,body,opts={}){
  return `<section class="win"><div class="tbar"><span>${title}</span>${opts.say?`<button class="say" id="sayb" aria-label="Leer en voz alta">🔊<span class="sl"> Leer</span></button>`:''}<button class="x" id="closeb" aria-label="Cerrar y volver al escritorio">✕</button></div><div class="wbody">${body}</div></section>`;
}
function bindClose(){const c=document.getElementById('closeb');if(c)c.onclick=home;}

/* Siguiente paso: una sola recomendación, para no tener que decidir */
function nextStep(){
  for(const b of BLOCKS){ if(b.extra)continue;
    if(!S.seen[b.id])return{txt:`Aprender: ${b.name}`,sub:`${b.cards.length} ${b.cards.length>1?'tarjetas':'tarjeta'}, menos de ${Math.max(2,b.cards.length)} minutos`,fn:()=>openCards(b.id)};
    if(doneOf(b.id)<qsOf(b.id).length)return{txt:`Practicar: ${b.name}`,sub:`Te faltan ${qsOf(b.id).length-doneOf(b.id)} preguntas por dominar`,fn:()=>startBlock(b.id)};
  }
  return{txt:'Simulacro de examen',sub:'50 preguntas, con una pausa cada 10',fn:startSim};
}
function folder(){return `<svg viewBox="0 0 52 52" aria-hidden="true"><path d="M4 12h17l5 6h22v26H4z" fill="#e6a817"/><path d="M4 20h44v24H4z" fill="#ffd34f"/></svg>`;}

  app.innerHTML=`
  <div class="today"><div class="tbar"><span>Tema 2: el sistema operativo</span></div>

  <div class="icons">

    <button class="icon" id="m-av">${avatarSVG(gLoad().av,44)}Mi muñeco<br>⭐ ${gStars()}</button><button class="icon" id="m-jg"><span class="pic">🎮</span>Juego<br>${gLoad().fichas} fichas</button>${ligaOn()?'<button class="icon" id="m-lg"><span class="pic">🏆</span>Clasificación<br>y duelos</button>':''}
    <button class="icon" id="m-pc"><span class="pic">💻</span>En mi ordenador<br>Windows 10 y 11</button>
    <button class="icon" id="m-quick"><span class="pic">🎯</span>Misión rápida<br>10 preguntas</button>
    <button class="icon" id="m-sim"><span class="pic">📝</span>Simulacro<br>50 preguntas</button>
    <button class="icon" id="m-wrong"><span class="pic">🔁</span>Mis fallos<br>${w} ${w===1?'pregunta':'preguntas'}</button>
    <button class="icon" id="m-cheat"><span class="pic">📄</span>Chuleta<br>para repasar</button>
  </div>`;
  document.getElementById('nextb').onclick=n.fn;
  document.querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>openBlock(e.dataset.b));
  document.getElementById('m-mis').onclick=openMissions;
  document.getElementById('m-pc').onclick=pcPractice;
  document.getElementById('m-av').onclick=()=>openAvatarEditor(home);document.getElementById('m-jg').onclick=()=>openGame(home);const lg=document.getElementById('m-lg');if(lg)lg.onclick=()=>openLeague(home);

function openBlock(id){
  const b=BLOCKS.find(x=>x.id===id),t=qsOf(id).length,d=doneOf(id);
  app.innerHTML=win(b.name,`<h2>${b.name}</h2><p class="muted">${d} de ${t} preguntas dominadas. Una pregunta queda dominada al acertarla dos veces seguidas.</p>
   <div class="row"><button class="btn go" id="lc">Aprender (${b.cards.length} ${b.cards.length>1?'tarjetas':'tarjeta'})</button><button class="btn" id="lq">Practicar</button></div>`);
  bindClose();document.getElementById('lc').onclick=()=>openCards(id);document.getElementById('lq').onclick=()=>startBlock(id);window.scrollTo(0,0);
}

/* ===== TARJETAS ===== */
function openCards(id){card={id,i:0};showCard();}
function showCard(){
  const b=BLOCKS.find(x=>x.id===card.id),c=b.cards[card.i],n=b.cards.length,last=card.i===n-1;
  app.innerHTML=win(`${b.name}: tarjeta ${card.i+1} de ${n}`,`<div class="progress"><i style="width:${(card.i+1)/n*100}%"></i></div>
    <h2>${c.t}</h2><div class="big">${c.h}</div>${c.try?`<div class="do"><b>Pruébalo en tu ordenador:</b> ${c.try}</div>`:''}
    <div class="row">${card.i>0?'<button class="btn" id="pv">Anterior</button>':''}<button class="btn go" id="nx">${last?'¡A practicar!':'Siguiente'}</button></div>
    <p class="keys">Teclado: flechas para pasar de tarjeta.</p>`,{say:true});
  bindClose();
  document.getElementById('sayb').onclick=()=>speak(c.t+'. '+c.h+(c.try?'. '+c.try:''));
  const go=()=>{ if(last){S.seen[b.id]=true;save();startBlock(b.id);} else {card.i++;showCard();} };
  const bk=()=>{ if(card.i>0){card.i--;showCard();} };
  document.getElementById('nx').onclick=go;
  const p=document.getElementById('pv');if(p)p.onclick=bk;
  keyHandler=e=>{ if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();go();} if(e.key==='ArrowLeft')bk(); };
  document.getElementById('nx').focus({preventScroll:true});window.scrollTo(0,0);
}

/* ===== TEST ===== */
function makeRun(ids,mode,label){return{ids:[...ids],mode,label,i:0,ok:0,bad:0,miss:[],retry:{},first:ids.length,asked:0,done:false};}
function pick(pool,n){
  const pri=shuffle(pool.filter(q=>S.wrong[q.id])),todo=shuffle(pool.filter(q=>!S.wrong[q.id]&&!mastered(q))),rest=shuffle(pool.filter(q=>!S.wrong[q.id]&&mastered(q)));
  return [...pri,...todo,...rest].slice(0,n).map(q=>String(q.id));
}
function startBlock(id){S.seen[id]=true;save();const b=BLOCKS.find(x=>x.id===id);run=makeRun(pick(qsOf(id),8),'practice',b.name);showQ();}
function startQuick(){run=makeRun(pick(OFFICIAL,10),'practice','Misión rápida');showQ();}
function startWrong(){const w=wrongList();if(!w.length){app.innerHTML=win('Mis fallos','<h2>Ningún fallo pendiente</h2><p>Haz una misión rápida y, si fallas algo, aparecerá aquí.</p><div class="row"><button class="btn go" id="qq">Hacer misión rápida</button></div>');bindClose();document.getElementById('qq').onclick=startQuick;return;}
  run=makeRun(shuffle(w).slice(0,10),'practice','Mis fallos');showQ();}
function startSim(){app.innerHTML=win('Simulacro de examen',`<h2>Simulacro de 50 preguntas</h2>
  <div class="big"><ul><li>Como el examen: 50 preguntas de los apuntes del profe.</li><li>No verás si aciertas hasta el final.</li><li>Cada 10 preguntas, una pausa.</li></ul></div>
  <p class="muted">Tardarás unos 20 minutos. Busca un sitio tranquilo.</p><div class="row"><button class="btn go" id="sg">Empezar simulacro</button></div>`);
  bindClose();document.getElementById('sg').onclick=()=>{run=makeRun(shuffle(OFFICIAL).slice(0,50).map(q=>String(q.id)),'sim','Simulacro');showQ();};window.scrollTo(0,0);}

function showQ(){
  if(run.i>=run.ids.length)return results();
  if(run.mode==='sim'&&run.i>0&&run.i%10===0&&!run.pausedAt10){run.pausedAt10=true;return pause();}
  run.pausedAt10=false;
  const t0=Date.now(),q=pickVar(byId[run.ids[run.i]]),opts=gOrden(q.a,q.w,run.ids[run.i]),tot=run.ids.length;window.CURQ=q;
  const chip=q.c==='r'?'<span class="chg r">Cambia desde XP: esta es la de Windows 10 y 11</span>':q.c==='o'?'<span class="chg o">Pequeño cambio: esta es la de Windows 10 y 11</span>':'';
  app.innerHTML=win(`${run.label}: ${run.i+1} de ${tot}`,`<div class="progress"><i style="width:${run.i/tot*100}%"></i></div>${run.mode==='sim'?'':chip}
    <div class="q">${gB(q.q)}</div>
    <div id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><b>${i+1}</b><span>${o}</span></button>`).join('')}</div>
    <div id="fb"></div><p class="keys" id="kh">Teclado: pulsa ${opts.map((_,i)=>i+1).join(', ')} para responder.</p>`,{say:true});
  bindClose();
  document.getElementById('sayb').onclick=()=>speak(q.q.replace(/\*\*/g,'')+' '+opts.map((o,i)=>`Opción ${i+1}: ${o}`).join('. '));
  let answered=false;
  const answer=i=>{ if(answered)return;answered=true;
    const pickd=opts[i],right=pickd===q.a,first=!run.retry[q.id];run.asked++;gNota(right);
    if(right){ if(first)run.ok++; gCorrect(q.id);if(first)gAward(1); S.st[q.id]=(S.st[q.id]||0)+1; if(mastered(q))delete S.wrong[q.id]; }
    else{ if(first){run.bad++;run.miss.push(String(q.id));} S.st[q.id]=0; S.wrong[q.id]=true; }
    save();stat();
    if(run.mode==='sim'){document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===i){b.style.borderColor='#2a5bb8';b.style.background='#e8eef8';}else b.classList.add('faded');});const nx=gSig(document.getElementById('fb'),t0,()=>{run.i++;showQ();},'btn go');document.getElementById('kh').textContent='Teclado: pulsa Intro para seguir.';keyHandler=e=>{if(e.key==='Enter'){e.preventDefault();nx();}};return;}
    ding(right);
    document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(opts[k]===q.a)b.classList.add('ok');else if(k===i)b.classList.add('bad');else b.classList.add('faded');});
    if(!right&&!run.retry[q.id]){run.retry[q.id]=true;const at=Math.min(run.i+3,run.ids.length);run.ids.splice(at,0,String(q.id));}
    const fb=document.getElementById('fb');
    fb.innerHTML=`<div class="fb ${right?'ok':'bad'}" role="status"><strong>${right?'¡Correcto!':'Casi. La buena es la verde.'}</strong>${q.n||''}</div>`;
    document.getElementById('kh').textContent='Teclado: pulsa Intro para seguir.';

    keyHandler=e=>{if(e.key==='Enter'){e.preventDefault();nx();}};
  };
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  keyHandler=e=>{const n=+e.key;if(n>=1&&n<=opts.length){e.preventDefault();answer(n-1);}};
  window.scrollTo(0,0);
}

    ${banner}${!sim?'<div class="tip">Buen momento para un descanso de 2 minutos.</div>':''}
    <div class="row">${run.miss.length?`<button class="btn go" id="rp">Repasar ${run.miss.length===1?'el fallo':'los '+run.miss.length+' fallos'}</button>`:''}<button class="btn" id="hm">Volver al escritorio</button></div>
    ${list?`<h3>Respuestas correctas de las que fallaste</h3>${list}`:''}`);
  bindClose();document.getElementById('hm').onclick=home;

}

/* ===== DIÁLOGOS ===== */
function modal(title,body,okText,onOk,cancelText){
  const old=document.getElementById('modal');if(old)old.remove();
  const m=document.createElement('div');m.id='modal';
  m.innerHTML=`<section class="win" role="dialog" aria-modal="true" aria-label="${title}"><div class="tbar"><span>${title}</span></div><div class="wbody">${body}<div class="row"><button class="btn go" id="mok">${okText}</button>${cancelText?`<button class="btn" id="mcx">${cancelText}</button>`:''}</div></div></section>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.querySelector('#mok').onclick=()=>{close();onOk&&onOk();};
  const cx=m.querySelector('#mcx');if(cx)cx.onclick=close;
  m.querySelector('#mok').focus();
}

/* ===== RELOJ: temporizador de concentración ===== */
let tEnd=null,tKind=null;
function tick(){
  const c=document.getElementById('clock');
  if(tEnd){
    const left=Math.max(0,tEnd-Date.now()),m=Math.floor(left/60000),s=Math.floor(left/1000)%60;
    c.textContent=`${tKind==='work'?'⏱':'☕'} ${m}:${String(s).padStart(2,'0')}`;
    if(left<=0){const was=tKind;tEnd=null;tKind=null;ding(true);
      if(was==='work')modal('¡10 minutos!','<div class="big"><p>Muy bien. Toca descansar 3 minutos: levántate, bebe agua y muévete.</p></div>','Empezar descanso',()=>{tEnd=Date.now()+180000;tKind='rest';},'Seguir un poco más');
      else modal('Descanso terminado','<div class="big"><p>¿Otra tanda de 10 minutos?</p></div>','Empezar',()=>{tEnd=Date.now()+600000;tKind='work';},'Ahora no');
    }
  } else {c.textContent='⏱ 10 min';}
}
document.getElementById('clock').onclick=()=>{
  if(tEnd){tEnd=null;tKind=null;}else{tEnd=Date.now()+600000;tKind='work';}
  tick();
};
setInterval(tick,1000);tick();
