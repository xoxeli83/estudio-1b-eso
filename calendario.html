<style>
/* Layout: a sticky toolbar over a scaled live preview of the printable A3 sheet, with the month's editable list below. */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --fg:#1B2033; --muted:#5B6275; --line:#DCE0EA;
  --accent:#5B3FD9; --accent-fg:#FFFFFF; --danger:#C92A2A; --soft:#ECEAFB;
  --font:'Poppins', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141C; --surface:#1C1F2B; --fg:#ECEEF5; --muted:#A3A9BA; --line:#2E3344;
  --accent:#9C88FF; --accent-fg:#14121F; --danger:#FF8787; --soft:#272240; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141C; --surface:#1C1F2B; --fg:#ECEEF5; --muted:#A3A9BA; --line:#2E3344;
  --accent:#9C88FF; --accent-fg:#14121F; --danger:#FF8787; --soft:#272240; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;max-width:1500px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.brand{font-weight:800;font-size:17px;margin-right:auto;min-width:0}

.nav{display:flex;align-items:center;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.mname{min-width:150px;text-align:center;font-weight:700;font-size:16px}
.btn{height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}

.months{display:flex;flex-wrap:wrap;gap:6px;padding-block:14px 10px}
.mtab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-weight:600;font-size:13px}
.mtab[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.export{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:12px}
.export label{font-size:13px;font-weight:600;color:var(--muted)}
.export select{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px}
.status{font-size:13px;color:var(--muted);min-width:0}

.preview{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;overflow:hidden}
.scaler{transform-origin:0 0}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}

.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}
.panel h2{margin:0 0 8px;font-size:17px;text-wrap:balance}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.row:first-of-type{border-top:0}
.rdate{width:58px;flex-shrink:0;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.rdate span{display:block;font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase}
.pill{flex-shrink:0;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:3px 7px;border-radius:7px;color:#fff}
.rtext{flex:1;min-width:0;font-size:14px;line-height:1.3}
.rtext b{display:block}
.rtext span{color:var(--muted)}
.edit{flex-shrink:0;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--fg);border-radius:20px;width:min(520px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal h2{margin:0;font-size:20px}
.kinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kind{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.kind[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.subjs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.subj{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--surface);font-weight:600;font-size:13px;text-align:left}
.subj[aria-pressed="true"]{border-color:var(--fg)}
.dot{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .sp{margin-left:auto}
.err{color:var(--danger);font-size:13px}

.sheet .cell.we{background:#F4F6F8;border-color:#E9ECEF}

.sheet .ch{display:flex;align-items:center;gap:6px;height:26px;flex-shrink:0}
.sheet .num{font-size:24px;font-weight:700;line-height:1}

.sheet .ct{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.sheet .lab{font-size:12.5px;font-weight:700;line-height:1.15;margin-bottom:1px}
.sheet .tx{font-size:14px;font-weight:600;line-height:1.15;max-height:2.35em;overflow:hidden}
.sheet .chip.re{background:#FFF3BF;border:2.5px dashed #F59F00;padding:2px 6px;gap:4px;border-radius:10px}
.sheet .relab{font-size:11.5px;font-weight:600;color:#5C3D00;line-height:1.2}
.sheet .more{font-size:12px;font-weight:700;color:#495057;padding-left:4px}
.sheet .vac{margin-top:auto;display:flex;align-items:center;gap:6px;background:#2F9E44;color:#fff;font-weight:700;font-size:14px;border-radius:12px;padding:7px 9px;overflow:hidden;white-space:nowrap}
.sheet .side{width:345px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
.sheet .mission{flex:1;min-height:0;border-radius:24px;padding:18px 16px 14px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.sheet h2{margin:0;font-size:27px;line-height:1.1;font-weight:800}
.sheet .hint2{margin:0 0 4px;font-size:13px;color:#495057}
.sheet .list{display:flex;flex-direction:column;gap:6px}
.sheet .it{display:flex;align-items:center;gap:7px;background:#fff;border-radius:14px;padding:5px 8px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.sheet .box{width:26px;height:26px;border:3px solid #343A40;border-radius:7px;flex-shrink:0;background:#fff}

.sheet .dn{font-size:20px;font-weight:700}
.sheet .ib2{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sheet .itx{display:flex;flex-direction:column;min-width:0;gap:1px}
.sheet .itop{display:flex;align-items:center;gap:6px}
.sheet .tag{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:6px;letter-spacing:.3px;white-space:nowrap}
.sheet .sn{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden}

.sheet .tl{margin-top:2px;font-size:12.5px;line-height:1.4;color:#3D2B00}

    <div class="nav">

      <button class="iconbtn" id="next" aria-label="Mes siguiente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>

  </div>
</header>

<main class="wrap">
  <nav class="months" id="months" aria-label="Meses del curso"></nav>

  <section class="export" aria-label="Descargar para imprimir">
    <label for="exRange">Imprimir</label>
    <select id="exRange">
      <option value="month">Este mes</option>
      <option value="t1">1º trimestre (sep–dic)</option>
      <option value="t2">2º trimestre (ene–mar)</option>
      <option value="t3">3º trimestre (abr–jun)</option>
      <option value="all">Todo el curso (sep–jun)</option>
    </select>
    <label for="exSize">Papel</label>
    <select id="exSize">
      <option value="a3">A3 horizontal</option>
      <option value="a4">A4 horizontal</option>
    </select>
    <button class="btn primary" id="pdfBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Descargar PDF</button>
    <span class="status" id="status" role="status"></span>
  </section>

  <div class="preview"><div id="scaleBox"><div class="scaler" id="scaler"></div></div></div>
  <p class="hint">Toca un día del calendario para añadir algo en esa fecha, o toca un examen o entrega para cambiarlo.</p>

  <div class="lists">
    <section class="panel" aria-labelledby="h-items"><h2 id="h-items">Exámenes y trabajos del mes</h2><div id="itemList"></div></section>
    <section class="panel" aria-labelledby="h-off"><h2 id="h-off">Días sin cole del mes</h2><div id="offList"></div></section>
  </div>
</main>

<div id="exportHost" aria-hidden="true"></div>

<div class="scrim" id="scrim" hidden>
  <form class="modal" id="form" novalidate>
    <h2 id="fTitle">Añadir</h2>
    <div class="kinds" role="group" aria-label="Tipo">
      <button type="button" class="kind" data-kind="EX">Examen</button>
      <button type="button" class="kind" data-kind="EN">Entrega</button>
      <button type="button" class="kind" data-kind="PRO">Proyecto</button>
      <button type="button" class="kind" data-kind="OFF">Sin cole</button>
    </div>
    <div class="two">
      <div class="field"><label for="fDate" id="fDateL">Fecha</label><input type="date" id="fDate" required></div>
      <div class="field" id="fToWrap"><label for="fTo">Hasta (opcional)</label><input type="date" id="fTo"></div>
    </div>
    <div class="field" id="fSubjWrap"><label>Asignatura</label><div class="subjs" id="fSubjs"></div></div>
    <div class="field"><label for="fText" id="fTextL">¿De qué es?</label><input type="text" id="fText" maxlength="60" placeholder="Ej.: Unidad 3, Tema 2, Proyecto…" autocomplete="off"></div>
    <p class="hint" id="fAutor" hidden></p>
    <p class="err" id="fErr" hidden></p>
    <div class="actions">
      <button type="button" class="btn danger" id="fDel" hidden>Borrar</button>
      <button type="button" class="btn danger" id="fDelYes" hidden>Sí, borrar</button>
      <span class="sp"></span>
      <button type="button" class="btn" id="fCancel">Cancelar</button>
      <button type="submit" class="btn primary" id="fSave">Guardar</button>
    </div>
  </form>
</div>

function offMap(){
  const map = {};
  offs.forEach((o)=>{ if(!o.from) return; let d = pd(o.from); const end = pd(o.to && o.to>=o.from ? o.to : o.from); let guard=0; while(d<=end && guard++<400){ map[ds(d)] = {label:o.label||'Sin cole', id:o.id}; d = addDays(d,1); } });
  return map;
}
const isSchool = (d,om)=> d.getDay()!==0 && d.getDay()!==6 && !om[ds(d)];
function byDay(om){
  const map = {};
  const push = (k,e)=>{ (map[k]=map[k]||[]).push(e); };
  items.forEach((e)=>{ if (e.date) push(e.date, e); });
  items.filter((e)=>e.kind==='EX' && e.date).forEach((e)=>{
    const ex = pd(e.date); if (ex<=TODAY) return;
    let p = addDays(ex,-1), g=0; while(!isSchool(p,om) && g++<30) p = addDays(p,-1);
    if (p<TODAY) return;
    const k = ds(p);
    if ((map[k]||[]).some((r)=>r.kind==='RE' && r.subj===e.subj)) return;
    const gap = Math.round((ex-p)/86400000);
    push(k,{kind:'RE', subj:e.subj, text: gap===1?'¡mañana examen!':(ex.getDay()===1?'¡examen el lunes!':'examen el '+WDS[ex.getDay()]+' '+ex.getDate())});
  });
  return map;
}

    '<header class="banner" style="background:'+T.c+'"><svg class="deco" width="560" height="170" viewBox="0 0 560 170" aria-hidden="true">'+deco(T.deco)+'</svg>'+
      '<div class="title"><h1>'+MONTHS[m]+'</h1><div class="sub">'+y+' · 1º B ESO · Mi calendario de exámenes y entregas</div></div>'+
      '<div class="counts"><div class="cnt"><span class="cn" style="color:'+T.d+'">'+nEx+'</span><span class="cl">'+(nEx===1?'examen':'exámenes')+'</span></div><div class="cnt"><span class="cn" style="color:'+T.d+'">'+nEn+'</span><span class="cl">'+(nEn===1?'entrega':'entregas')+'</span></div></div></header>'+
    '<div class="legend">'+legend+'<span class="key"><span class="k1">¡EXAMEN!</span><span class="k2">ENTREGA</span><span class="k4">'+icon('STAR',14,'#343A40',2.5)+' PROYECTO</span><span class="k3">'+icon('BULB',16,'#B35C00',2.5)+' Repasa</span></span></div>'+
    '<div class="main"><div class="cal"><div class="wk wdr">'+wds+'</div>'+rows+'</div>'+
      '<aside class="side"><div class="mission" style="background:'+T.s+'"><h2 style="color:'+T.d+'">Mi misión de '+MONTHS[m].toLowerCase()+'</h2><p class="hint2">Tacha cada casilla cuando lo termines</p>'+
        (monthItems.length ? '<div class="list'+(compact?' compact':'')+'">'+listItems+'</div>' : '<div class="emptym">Nada con fecha este mes todavía.</div>')+'</div>'+
        vacBox+
        (showTips ? '<div class="tips"><div class="tt">'+icon('BULB',22,'#B35C00',2.5)+' Trucos</div><div class="tl">Mira el calendario cada noche · Repasa un poco cada día · Mochila lista la noche antes</div></div>' : '')+
        '<div class="tips" style="background:#FFFFFF;border:3px dashed #2B8A3E"><div class="tt" style="color:#2B8A3E;font-size:14px">'+icon('LEN',20,'#2B8A3E')+' LENGUA · TODO EL CURSO</div><div class="tl" style="color:#1A1B1E">Opcional: recitar <b>La canción del pirata</b> = hasta <b>+1 punto</b>. Libro de lectura: <b>La isla del tesoro</b>.</div></div>'+
      '</aside></div>'+
    '<div class="foot">Actualizado el '+TODAY.getDate()+'/'+(TODAY.getMonth()+1)+'/'+TODAY.getFullYear()+'</div>'+
  '</div>';
}

// ---------- screen render ----------
const scaler = document.getElementById('scaler');
const scaleBox = document.getElementById('scaleBox');
function fit(){ const w = scaleBox.clientWidth; const s = Math.min(1, w/1587); scaler.style.transform = 'scale('+s+')'; scaleBox.style.height = Math.ceil(1123*s)+'px'; }
new ResizeObserver(fit).observe(scaleBox);

function render(){
  document.getElementById('mname').textContent = MONTHS[cur.m]+' '+cur.y;
  document.getElementById('months').innerHTML = COURSE.map((c)=>'<button type="button" class="mtab" data-y="'+c.y+'" data-m="'+c.m+'" aria-current="'+(c.y===cur.y&&c.m===cur.m)+'">'+MTAB[c.m]+'</button>').join('');
  scaler.innerHTML = sheetHTML(cur.y, cur.m);
  fit();
  const mi = items.filter((e)=>e.date && pd(e.date).getFullYear()===cur.y && pd(e.date).getMonth()===cur.m).sort((a,b)=>a.date<b.date?-1:1);
  document.getElementById('itemList').innerHTML = mi.length ? mi.map((e)=>{ const d=pd(e.date); const S=SUBJ[e.subj]||SUBJ.GEN;
    return '<div class="row"><div class="rdate">'+d.getDate()+' '+MTAB[d.getMonth()].toLowerCase()+'<span>'+WDS[d.getDay()]+'</span></div><span class="pill" style="background:'+S.c+'">'+({EX:'EXAMEN',EN:'ENTREGA',PRO:'PROYECTO'}[e.kind]||'')+'</span><div class="rtext"><b>'+esc(S.full||S.n)+'</b><span>'+esc(e.text||'')+'</span></div><button type="button" class="edit" data-edit="'+esc(e.id)+'">Editar</button></div>'; }).join('') : '<p class="empty">Nada este mes. Pulsa «Añadir» para poner un examen o una entrega.</p>';
  const mStart = new Date(cur.y,cur.m,1), mEnd = new Date(cur.y,cur.m+1,0);
  const mo = offs.filter((o)=>o.from && pd(o.from)<=mEnd && pd(o.to||o.from)>=mStart).sort((a,b)=>a.from<b.from?-1:1);
  document.getElementById('offList').innerHTML = mo.length ? mo.map((o)=>{ const a=pd(o.from), b=pd(o.to||o.from); const same=o.from===(o.to||o.from);
    return '<div class="row"><div class="rdate">'+a.getDate()+' '+MTAB[a.getMonth()].toLowerCase()+'<span>'+(same?WDS[a.getDay()]:'al '+b.getDate()+' '+MTAB[b.getMonth()].toLowerCase())+'</span></div><span class="pill" style="background:#868E96">SIN COLE</span><div class="rtext"><b>'+esc(o.label||'Sin cole')+'</b></div><button type="button" class="edit" data-editoff="'+esc(o.id)+'">Editar</button></div>'; }).join('') : '<p class="empty">Ningún festivo ni vacaciones este mes.</p>';
}

function go(delta){ let m=cur.m+delta, y=cur.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} cur={y,m}; render(); }
document.getElementById('prev').addEventListener('click',()=>go(-1));
document.getElementById('next').addEventListener('click',()=>go(1));
document.getElementById('months').addEventListener('click',(ev)=>{ const b=ev.target.closest('.mtab'); if(!b) return; cur={y:+b.dataset.y,m:+b.dataset.m}; render(); });

// ---------- form ----------
const scrim = document.getElementById('scrim');
const form = document.getElementById('form');
const f = { date:document.getElementById('fDate'), to:document.getElementById('fTo'), text:document.getElementById('fText'), subjs:document.getElementById('fSubjs'), err:document.getElementById('fErr'), del:document.getElementById('fDel'), delYes:document.getElementById('fDelYes') };
let edit = null; // {coll, id}
let fKind = 'EX', fSubj = 'MAT';
f.subjs.innerHTML = SUBJ_ORDER.map((k)=>'<button type="button" class="subj" data-subj="'+k+'"><span class="dot" style="background:'+SUBJ[k].c+'">'+icon(k,16,'#FFFFFF')+'</span>'+esc(SUBJ[k].full||SUBJ[k].n)+'</button>').join('');
function syncForm(){
  document.querySelectorAll('.kind').forEach((b)=>b.setAttribute('aria-pressed', String(b.dataset.kind===fKind)));
  document.querySelectorAll('.subj').forEach((b)=>b.setAttribute('aria-pressed', String(b.dataset.subj===fSubj)));
  const off = fKind==='OFF';
  document.getElementById('fSubjWrap').hidden = off;
  document.getElementById('fToWrap').hidden = !off;
  document.getElementById('fDateL').textContent = off ? 'Desde' : 'Fecha';
  document.getElementById('fTextL').textContent = off ? 'Motivo' : '¿De qué es?';
  f.text.placeholder = off ? 'Festivo, Vacaciones, Sin cole…' : 'Ej.: Unidad 3, Tema 2, Proyecto…';
}
function openForm(opts){
  edit = opts.edit || null;
  fKind = opts.kind || 'EX'; fSubj = opts.subj || fSubj || 'MAT';
  f.date.value = opts.date || ds(TODAY); f.to.value = opts.to || ''; f.text.value = opts.text || '';
  f.err.hidden = true; f.delYes.hidden = true; f.del.hidden = !edit;
  const fa=document.getElementById('fAutor');fa.hidden=!opts.autor;fa.textContent=opts.autor?'Lo puso o cambió: '+opts.autor:'';
  document.getElementById('fTitle').textContent = edit ? 'Cambiar' : 'Añadir';
  syncForm(); scrim.hidden = false; setTimeout(()=>f.text.focus(), 30);
}
function closeForm(){ scrim.hidden = true; edit = null; }
document.querySelectorAll('.kind').forEach((b)=>b.addEventListener('click',()=>{ fKind=b.dataset.kind; syncForm(); }));
f.subjs.addEventListener('click',(ev)=>{ const b=ev.target.closest('.subj'); if(!b) return; fSubj=b.dataset.subj; syncForm(); });
document.getElementById('fCancel').addEventListener('click', closeForm);
scrim.addEventListener('click',(ev)=>{ if(ev.target===scrim) closeForm(); });
document.addEventListener('keydown',(ev)=>{ if(ev.key==='Escape' && !scrim.hidden) closeForm(); });
f.del.addEventListener('click',()=>{ f.del.hidden=true; f.delYes.hidden=false; f.delYes.focus(); });
f.delYes.addEventListener('click', async ()=>{ if(!edit) return; try{ await deleteItem(edit.coll, edit.id); closeForm(); }catch(e){ f.err.textContent='No se pudo borrar. Vuelve a intentarlo.'; f.err.hidden=false; } });
form.addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  if (!f.date.value){ f.err.textContent='Pon la fecha.'; f.err.hidden=false; return; }
  const btn = document.getElementById('fSave'); btn.disabled = true;
  try{
    if (fKind==='OFF'){
      const to = f.to.value && f.to.value>=f.date.value ? f.to.value : f.date.value;
      const data = {from:f.date.value, to, label:(f.text.value.trim()||'Sin cole')};
      const id = edit && edit.coll==='off' ? edit.id : null;
      if (edit && edit.coll==='items') await deleteItem('items', edit.id);
      await saveItem('off', id, data);
    } else {
      const data = {date:f.date.value, subj:fSubj, kind:fKind, text:f.text.value.trim()};
      const id = edit && edit.coll==='items' ? edit.id : null;
      if (edit && edit.coll==='off') await deleteItem('off', edit.id);
      await saveItem('items', id, data);
    }
    const d = pd(f.date.value); cur = {y:d.getFullYear(), m:d.getMonth()};
    closeForm(); render();
  }catch(e){ f.err.textContent = 'No se pudo guardar. Comprueba la conexión y vuelve a intentarlo.'; f.err.hidden=false; }
  finally{ btn.disabled = false; }
});
document.getElementById('addBtn').addEventListener('click',()=>{ const d = (TODAY.getFullYear()===cur.y && TODAY.getMonth()===cur.m) ? TODAY : new Date(cur.y,cur.m,1); openForm({date:ds(d)}); });
function openEdit(id){ const e = items.find((x)=>x.id===id); if(!e) return; openForm({edit:{coll:'items',id}, kind:e.kind, subj:e.subj, date:e.date, text:e.text, autor:e.autor}); }
function openEditOff(id){ const o = offs.find((x)=>x.id===id); if(!o) return; openForm({edit:{coll:'off',id}, kind:'OFF', date:o.from, to:o.to, text:o.label, autor:o.autor}); }
scaler.addEventListener('click',(ev)=>{
  const chip = ev.target.closest('[data-id]'); if (chip){ openEdit(chip.dataset.id); return; }
  const cell = ev.target.closest('[data-date]'); if (cell){ const o = offMap()[cell.dataset.date]; if (o && !(items.some((e)=>e.date===cell.dataset.date))) { openEditOff(o.id); return; } openForm({date:cell.dataset.date}); }
});
document.querySelector('.lists').addEventListener('click',(ev)=>{ const a=ev.target.closest('[data-edit]'); if(a){ openEdit(a.dataset.edit); return; } const b=ev.target.closest('[data-editoff]'); if(b) openEditOff(b.dataset.editoff); });

// ---------- PDF export ----------
const statusEl = document.getElementById('status');
const pdfBtn = document.getElementById('pdfBtn');
function loadScript(src){ return new Promise((res,rej)=>{ if (document.querySelector('script[src="'+src+'"]')) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('load')); document.head.appendChild(s); }); }
function rangeMonths(r){
  if (r==='month') return [cur];
  const idx = {t1:[0,4], t2:[4,7], t3:[7,10], all:[0,10]}[r];
  return COURSE.slice(idx[0], idx[1]);
}
pdfBtn.addEventListener('click', async ()=>{
  const months = rangeMonths(document.getElementById('exRange').value);
  const size = document.getElementById('exSize').value;
  pdfBtn.disabled = true;
  const host = document.getElementById('exportHost');
  try{
    statusEl.textContent = 'Preparando…';
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const jsPDF = window.jspdf.jsPDF;
    const pdf = new jsPDF({orientation:'landscape', unit:'mm', format:size});
    const W = size==='a3'?420:297, H = size==='a3'?297:210;
    for (let i=0;i<months.length;i++){
      statusEl.textContent = 'Creando '+MONTHS[months[i].m].toLowerCase()+' ('+(i+1)+' de '+months.length+')…';
      host.innerHTML = sheetHTML(months[i].y, months[i].m);
      const el = host.firstElementChild;
      const canvas = await window.html2canvas(el, {scale:2, backgroundColor:'#FFFFFF', logging:false, width:1587, height:1123, windowWidth:1700});
      if (i>0) pdf.addPage(size,'landscape');
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92), 'JPEG', 0, 0, W, H, undefined, 'FAST');
    }
    host.innerHTML = '';
    const name = 'Calendario_1B_' + (months.length===1 ? MONTHS[months[0].m]+'_'+months[0].y : MONTHS[months[0].m]+'-'+MONTHS[months[months.length-1].m]) + '_' + size.toUpperCase() + '.pdf';
    pdf.save(name);
    statusEl.textContent = 'PDF descargado. Imprímelo a tamaño real ('+size.toUpperCase()+').';
  }catch(e){
    host.innerHTML = '';
    statusEl.textContent = 'No se pudo crear el PDF. Vuelve a intentarlo.';
  }finally{ pdfBtn.disabled = false; }
});

render();
connect();
})();
</script>

</body></html>
