<style>
:root{
  --bg:#e8eef6; --ink:#17203a; --soft:#57617a; --line:#c6d0e0; --white:#fff;
  --main:#3a3ca6; --main2:#2c2e87; --tint:#e4e5fa; --sun:#ffc93c;
  --ok:#17783f; --okbg:#dcf5e4; --no:#9a5200; --nobg:#fff0d6;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Lexend,Verdana,"Segoe UI",sans-serif;font-size:21px;line-height:1.45;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid #ff8a00;outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding:14px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:18px}
.link{background:none;border:0;padding:8px 2px;color:var(--soft);font-size:17px;text-decoration:underline;text-underline-offset:3px}
.bar{flex:1;height:12px;background:#ced8e6;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main);border-radius:6px;transition:width .25s}
.say{background:none;border:0;font-size:24px;padding:4px 6px;line-height:1}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:6vh}
h1{font-size:36px;line-height:1.15;margin:4px 0 12px}
h2{font-size:28px;line-height:1.2;margin:0 0 14px}
h3{font-size:21px;margin:26px 0 8px}
p{margin:0 0 12px}
.small{font-size:18px;color:var(--soft)}
.go{display:block;width:100%;border:0;border-radius:14px;background:var(--main);color:#fff;font-weight:700;font-size:24px;padding:18px;min-height:68px;margin-top:20px;box-shadow:0 5px 0 var(--main2)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--main2)}
.go:disabled{background:#aab3c6;box-shadow:none;cursor:default}
.alt{display:block;width:100%;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:19px;padding:13px;margin-top:12px}
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;margin-top:22px}
.dots{display:flex;flex-wrap:wrap;gap:7px;margin-top:22px;justify-content:center}
.dots i{width:18px;height:18px;border-radius:50%;background:#ced8e6}
.dots i.d{background:var(--main)}
.dots i.n{background:#fff;box-shadow:inset 0 0 0 4px var(--main)}
.dots i.pop{background:var(--sun);animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.7)}100%{transform:scale(1)}}

/* Lección */
.fact{display:flex;gap:16px;align-items:center;background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;font-size:23px;line-height:1.35}
.fact .ic{flex:none;width:58px;text-align:center;font-size:42px;line-height:1}
.fact .ic svg{width:44px;height:60px;display:block;margin:0 auto}
.dib{margin:0 0 14px;background:#fff;border-radius:14px;padding:10px;text-align:center}.dib svg{width:100%;max-width:440px;height:auto;font-family:inherit}.chdib{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}@media print{.dib,.chdib>div{break-inside:avoid}}
kbd{display:inline-block;font:inherit;font-weight:700;font-size:.9em;background:#fff;border:2px solid #8391ab;border-bottom-width:4px;border-radius:7px;padding:0 8px;white-space:nowrap}

/* Pregunta */
.tag{font-size:17px;color:var(--main);font-weight:500;margin-bottom:6px}
.q{font-size:29px;line-height:1.25;font-weight:500;margin-bottom:20px}
.q b{color:var(--main);font-weight:700}
.opts{min-height:230px}
.opt{display:flex;gap:13px;align-items:center;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:11px;min-height:66px;font-size:21px;line-height:1.25}
.opt:hover:not(:disabled){border-color:var(--main)}
.opt .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--main);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok .n{background:var(--ok);color:#fff}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt.fade{opacity:.4}
.fb{border-radius:14px;padding:13px 16px;font-size:20px;margin-top:4px}
.fb.ok{background:var(--okbg);color:#0e5c2e;font-weight:700}
.fb.no{background:var(--nobg)}
.fb strong{display:block;margin-bottom:2px}

/* Pausa y lista */
.count{font-size:92px;font-weight:700;line-height:1;color:var(--main);text-align:center;margin:18px 0 4px}
.move{font-size:70px;text-align:center;line-height:1.1}
.tick{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px;font-size:22px;min-height:66px}
.tick .b{flex:none;width:34px;height:34px;border:3px solid var(--main);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.tick.on{border-color:var(--ok);background:var(--okbg)}
.tick.on .b{background:var(--ok);border-color:var(--ok)}
.big{font-size:64px;font-weight:700;line-height:1;margin:6px 0}

/* Mapa, chuleta, padres */
.page{font-size:19px;background:#fff;border-radius:14px;padding:20px}
.page h2{margin-bottom:8px}
.page ul,.page ol{padding-left:22px;margin:6px 0 10px}
.page li{margin-bottom:7px}
.page a{color:var(--main)}
.mrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;font-size:19px}
.mrow:hover{background:var(--tint)}
.mrow .s{flex:none;width:28px;height:28px;border-radius:50%;background:#ced8e6;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px}
.mrow.d .s{background:var(--main)}
table{border-collapse:collapse;width:100%;font-size:17px;margin:6px 0 12px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--tint)}
select{font:inherit;font-size:17px;padding:6px;border-radius:8px;border:2px solid var(--line);background:#fff;max-width:100%}
label.cfg{display:block;margin:10px 0}
@media (max-width:560px){body{font-size:19px}h1{font-size:30px}.q{font-size:25px}.fact{font-size:21px;padding:14px}.opt{font-size:19px}.mid{padding-bottom:2vh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body{background:#fff}.no-print{display:none!important}.page{padding:0}#app{max-width:none}}

.lg-tabs{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.lg-tabs button{font:inherit;font-size:15px;background:#fff;border:2px solid #c6d0e0;border-radius:9px;padding:6px 10px;min-height:40px;cursor:pointer;color:#17203a}.lg-tabs button.on{background:#3a3ca6;color:#fff;border-color:#3a3ca6}

function pickVar(base){
  if(base.gen){const r=base.gen();return Object.assign({id:base.id,b:base.b,c:base.c},r);}
  const vs=VAR[String(base.id)];
  if(!vs||!vs.length)return base;
  const i=Math.floor(Math.random()*(vs.length+1));
  if(i===vs.length)return base;
  const c=vs[i];
  return {id:base.id,b:base.b,c:base.c,n:base.n,q:c[0],a:c[1],w:c.slice(2)};
}

const G_FMAX=3,G_FPASO=2*3600*1000,G_FESP=3600*1000;
function gGana(g){if(g.fBloq&&Date.now()<g.fBloq)g.fRes=Math.min(G_FMAX,(g.fRes||0)+1);else g.fichas=Math.min(G_FMAX,g.fichas+1);}
function gFichas(g){const now=Date.now();if(g.prueba){g.fichas=G_FMAX;g.fBloq=0;g.fRes=0;return g;}if(g.fichas>G_FMAX)g.fichas=G_FMAX;if(g.fichas<=0&&!g.fBloq){g.fichas=0;g.fBloq=now+G_FESP;g.fRes=0;gSave(g);}if(g.fBloq){if(now<g.fBloq)return g;g.fichas=Math.min(G_FMAX,Math.max(1,g.fRes||0));g.fBloq=0;g.fRes=0;g.fichaT=now;gSave(g);}if(g.fichas>=G_FMAX){g.fichaT=now;return g;}if(!g.fichaT)g.fichaT=now;const n=Math.floor((now-g.fichaT)/G_FPASO);if(n>0){g.fichas=Math.min(G_FMAX,g.fichas+n);g.fichaT=g.fichas>=G_FMAX?now:g.fichaT+n*G_FPASO;}return g;}
function gLoad(){try{const r=localStorage.getItem(G_KEY);if(r){const j=JSON.parse(r),d=gDef();return gFichas(Object.assign(d,j,{av:Object.assign(d.av,j.av),st:Object.assign(d.st,j.st)}));}}catch(e){}return gFichas(G_mem||gDef());}

const PRAISE=['Misión hecha.','Hecha. Has llegado hasta el final.','Bien: has seguido hasta acabar.','Otra menos.','Hecha. Cada misión cuenta.'];

const SESSION_GAP=2*3600*1000;
let BREAK_SECS=30, OPT_DELAY=800, AUTO_NEXT=1100;

/* ===== Estado ===== */
const KEY='len.t12.v1';
let S={done:{},wrong:{},sess:{n:0,since:0,ts:0,ok:false},cfg:{brk:2,per:6,snd:true},best:null,lastDone:null};
try{const r=localStorage.getItem(KEY);if(r){const j=JSON.parse(r);S=Object.assign(S,j);}}catch(e){}
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}gAvSube(KEY,S);}
const app=document.getElementById('app');
let keyH=null,timers=[],R=null,popIndex=null;
const later=(f,t)=>{const id=setTimeout(f,t);timers.push(id);return id;};
function clearAll(){timers.forEach(clearTimeout);timers=[];keyH=null;try{speechSynthesis.cancel();}catch(e){}}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gF=s=>String(s).replace(/\{(-?\d+|\?)\/(\d+)\}/g,'<span class="frac"><i>$1</i><i>$2</i></span>');
const fmt=s=>gF(s).replace(/~([^~]+)~/g,'<span class="en">$1</span>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]/g,'<kbd>$1</kbd>');
const plain=s=>String(s).replace(/\{(-?\d+|\?)\/(\d+)\}/g,'$1 entre $2').replace(/~/g,'').replace(/_+/g,' ').replace(/\*\*/g,'').replace(/\[|\]/g,'').replace(/<[^>]+>/g,' ').replace(/\s\+\s/g,' más ');
const MOUSE=`<svg viewBox="0 0 44 60" role="img" aria-label="Botón derecho del ratón"><rect x="2" y="2" width="40" height="56" rx="20" fill="#fff" stroke="#17203a" stroke-width="3"/><path d="M22 3.5h0a18.5 18.5 0 0 1 18.5 18.5v5H22z" fill="#3a3ca6"/><path d="M22 2v25M2 27h40" stroke="#17203a" stroke-width="3"/></svg>`;
function ding(ok){
  if(!S.cfg.snd)return;
  try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=ok?784:330;g.gain.value=.05;
    o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.stop(c.currentTime+.27);}catch(e){}
}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(t));u.lang='es-ES';u.rate=.95;speechSynthesis.speak(u);}catch(e){}}
function gOye(q){if(!q.say)return;speak(q.say);const e=document.querySelector('.q');if(e){const b=document.createElement('button');b.className='link';b.style.cssText='display:block;font-size:16px;margin-top:8px';b.textContent='No se oye: ver el texto';b.onclick=()=>{b.outerHTML='<div class="small">'+fmt(q.say)+'</div>';};e.appendChild(b);}}
function shell(inner,{pct=null,say=null,exit=true}={}){
  app.innerHTML=`<div class="top no-print">${exit?'<button class="link" id="ex">Salir</button>':''}${pct!==null?`<div class="bar"><i style="width:${pct}%"></i></div>`:'<div style="flex:1"></div>'}${say?'<button class="say" id="say" aria-label="Leer en voz alta">🔊</button>':''}</div><div class="mid">${inner}</div>`;
  const e=document.getElementById('ex');if(e)e.onclick=home;
  const s=document.getElementById('say');if(s)s.onclick=()=>speak(say);
  window.scrollTo(0,0);
}
function dots(){
  const nx=M.findIndex((_,i)=>!S.done[i]);
  return `<div class="dots" aria-label="${Object.keys(S.done).length} de ${M.length} misiones">${M.map((_,i)=>`<i class="${i===popIndex?'pop':S.done[i]?'d':i===nx?'n':''}"></i>`).join('')}</div>`;
}
function freshSession(){if(Date.now()-S.sess.ts>SESSION_GAP){S.sess={n:0,since:0,ts:Date.now(),ok:false};save();}}
const wrongIds=()=>Object.keys(S.wrong).filter(k=>byId[k]);

/* ===== Inicio: una sola cosa que hacer ===== */
function nextAction(){
  const E=window.EX||M.length;const i=M.findIndex((_,k)=>k<E&&!S.done[k]);
  if(i>=0)return{small:window.EX?`Para el examen: misión ${i+1} de ${E}`:`Misión ${i+1} de ${M.length}`,title:M[i].t,sub:'Unos 2 minutos',fn:()=>ready(()=>lesson(i))};
  if(wrongIds().length)return{small:'Repaso',title:'Lo que te costó',sub:`${Math.min(5,wrongIds().length)} preguntas`,fn:()=>ready(startReview)};
  if(window.EX&&S.best!=null){const j=M.findIndex((_,k)=>!S.done[k]);if(j>=0)return{small:'Más de la unidad',title:M[j].t,sub:'Unos 2 minutos',fn:()=>ready(()=>lesson(j))};}
  return{small:'Último paso',title:'Simulacro de examen',sub:'30 preguntas, en 3 trozos de 10',fn:()=>ready(simIntro)};
}
function home(){
  clearAll();R=null;freshSession();
  const a=nextAction();
  shell(`<button class="av-home" id="av-open" aria-label="Mi muñeco">${avatarSVG(gLoad().av,52)}<b>⭐ ${gStars()}</b></button><p class="small">${a.small}</p><h1>${a.title}</h1><p class="small">${a.sub}</p>
    <button class="go" id="go">Empezar</button>${dots()}
    <div class="foot no-print"><a class="link" href="../index.html">Asignaturas</a><button class="link" id="l-map">Ver misiones</button><button class="link" id="l-che">📒 Apuntes</button><button class="link" id="l-pj">🎮 Preposiciones</button><button class="link" id="l-esc">✍️ Escribir</button><button class="link" id="l-jg">🎮 Juego</button>${ligaOn()?'<button class="link" id="l-lg">🏆 Clasificación</button>':''}<button class="link" id="l-par">Para padres</button>${window.parent!==window?'<button class="link" id="l-desk">Volver al escritorio</button>':''}</div>`,{exit:false});
  popIndex=null;
  const g=document.getElementById('go');g.onclick=a.fn;g.focus({preventScroll:true});
  document.getElementById('l-jg').onclick=()=>openGame(home);const llg=document.getElementById('l-lg');if(llg)llg.onclick=()=>openLeague(home);
  document.getElementById('av-open').onclick=()=>openAvatarEditor(home);
  document.getElementById('l-map').onclick=map;document.getElementById('l-che').onclick=cheat;document.getElementById('l-pj').onclick=prepIntro;document.getElementById('l-esc').onclick=escribirMenu;document.getElementById('l-par').onclick=parents;
  const ld=document.getElementById('l-desk');if(ld)ld.onclick=()=>window.parent.postMessage('cerrar-misiones','*');
  keyH=e=>{if(e.key==='Enter'){e.preventDefault();a.fn();}};
}

/* ===== Antes de empezar: autoinstrucciones ===== */
function ready(next){
  clearAll();freshSession();
  if(S.sess.ok)return next();
  const items=['La mesa, despejada','Móvil y juegos, lejos','Agua cerca'];const on=items.map(()=>false);
  shell(`<h2>Antes de empezar</h2>${items.map((t,i)=>`<button class="tick" data-i="${i}"><span class="b"></span>${t}</button>`).join('')}<button class="go" id="go" disabled>Listo</button>`);
  document.querySelectorAll('.tick').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;on[i]=!on[i];b.classList.toggle('on',on[i]);b.querySelector('.b').textContent=on[i]?'✓':'';
    document.getElementById('go').disabled=!on.every(Boolean);});
  document.getElementById('go').onclick=()=>{S.sess.ok=true;S.sess.ts=Date.now();save();next();};
}

/* ===== Lección: las ideas salen de una en una ===== */
function lesson(i){
  clearAll();const m=M[i];let shown=1;
  const draw=()=>{
    const fig=m.img&&DIB[m.img]?`<figure class="dib">${DIB[m.img]}</figure>`:'';const facts=fig+m.f.slice(0,shown).map(([ic,tx])=>`<div class="fact"><span class="ic">${ic==='R'?MOUSE:ic}</span><span>${fmt(tx)}</span></div>`).join('');
    const last=shown>=m.f.length;
    shell(`<h2>${m.t}</h2>${facts}<button class="go" id="go">${last?'A probar':'Otra idea'}</button>`,{pct:0,say:m.t+'. '+m.f.slice(0,shown).map(x=>x[1]).join('. ')});
    const go=()=>{if(last)startMission(i);else{shown++;draw();}};
    document.getElementById('go').onclick=go;document.getElementById('go').focus({preventScroll:true});
    keyH=e=>{if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();go();}};
  };draw();
}

/* ===== Preguntas ===== */
function reviewPick(i){
  const w=wrongIds().filter(k=>!M[i].q.map(String).includes(k));
  if(w.length)return pick(w);
  const pool=[];M.forEach((m,k)=>{if(S.done[k]&&k!==i)pool.push(...m.q.map(String));});
  return pool.length?pick(pool):null;
}
function startMission(i){
  const qs=shuffle(M[i].q.map(String));const rv=reviewPick(i);
  R={kind:'mission',i,queue:[...(rv?[{id:rv,rev:true}]:[]),...qs.map(id=>({id}))],pos:0,first:0,total:qs.length+(rv?1:0),tries:{},fixed:0};
  showQ();
}
function startReview(){
  const ids=shuffle(wrongIds()).slice(0,5);
  R={kind:'review',queue:ids.map(id=>({id,rev:true})),pos:0,total:ids.length,tries:{},fixed:0};showQ();
}
function showQ(){
  clearAll();
  if(R.pos>=R.queue.length)return R.kind==='mission'?afterMission():afterReview();
  const it=R.queue[R.pos],q=pickVar(byId[it.id]);window.CURQ=q;
  const wro=q.w.length<=2?q.w:shuffle(q.w).slice(0,2);
  const t0=Date.now(),opts=gOrden(q.a,wro,it.id);
  const pct=Math.round(R.pos/R.queue.length*100);
  const tag=it.rev&&R.kind==='mission'?'<div class="tag">Una de repaso</div>':it.again?'<div class="tag">Otra vez, ahora sale</div>':'';
  shell(`${tag}<div class="q">${fmt(q.q)}</div><div class="opts" id="opts"></div><div id="fb"></div>`,{pct,say:q.say||(q.q+' '+opts.map((o,i)=>`${i+1}: ${o}`).join('. '))});gOye(q);
  let done=false;
  const answer=k=>{
    if(done)return;done=true;
    const right=opts[k]===q.a;gNota(right);
    document.querySelectorAll('.opt').forEach((b,x)=>{b.disabled=true;if(opts[x]===q.a)b.classList.add('ok');else if(x===k)b.classList.add('no');else b.classList.add('fade');});
    ding(right);
    if(right){
      if(it.rev)delete S.wrong[it.id];
      gCorrect(it.id==+it.id?+it.id:it.id);if(!it.again)gAward(1);
      if(it.again)R.fixed++;
      save();
      const fb=document.getElementById('fb');fb.innerHTML=`<div class="fb ok" role="status"><strong>${pick(RIGHT)}</strong>${q.n?(typeof gF==='function'?gF(q.n):q.n):''}</div>`;
      const nx=gSig(fb,t0,()=>{R.pos++;showQ();});keyH=e=>{if(e.key==='Enter'){e.preventDefault();nx();}};
    }else{
      S.wrong[it.id]=true;save();
      if((R.tries[it.id]||0)<2){R.tries[it.id]=(R.tries[it.id]||0)+1;R.queue.push({id:it.id,again:true,rev:it.rev});}
      const fb=document.getElementById('fb');fb.innerHTML=`<div class="fb no" role="status"><strong>Es la verde.</strong>${gF(q.n)}</div>`;
      const nx=gSig(fb,t0,()=>{R.pos++;showQ();});
      keyH=e=>{if(e.key==='Enter'){e.preventDefault();nx();}};
    }
  };
  later(()=>{
    document.getElementById('opts').innerHTML=opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="n">${i+1}</span><span>${gF(o)}</span></button>`).join('');
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
    keyH=e=>{const n=+e.key;if(n>=1&&n<=opts.length){e.preventDefault();answer(n-1);}};
  },OPT_DELAY);
}
function afterMission(){
  const i=R.i,m=M[i],fixed=R.fixed;
  const finish=()=>{
    const was=S.done[i];S.done[i]=true;S.sess.n++;S.sess.since++;S.sess.ts=Date.now();save();gAward(was?2:5,60);const banner=gBanner();
    if(!was)popIndex=i;
    clearAll();
    const extra=fixed?`<p class="big" style="font-size:24px">Y has arreglado ${fixed===1?'una que se te resistía':fixed+' que se te resistían'}.</p>`:'';
    shell(`<h1>${pick(PRAISE)}</h1>${extra}${banner}<p class="small">${Object.keys(S.done).length} de ${M.length} misiones</p>${dots()}<button class="go" id="go">${nextLabel()}</button>`,{exit:false});
    popIndex=null;
    const go=()=>route();
    document.getElementById('go').onclick=go;document.getElementById('go').focus({preventScroll:true});
    keyH=e=>{if(e.key==='Enter'){e.preventDefault();go();}};
  };
  if(m.try){
    clearAll();
    shell(`<h2>Reto en tu cuaderno</h2><div class="fact"><span class="ic">✏️</span><span>${fmt(m.try)}</span></div><button class="go" id="go">¡Hecho!</button><button class="alt" id="no">Ahora no</button>`,{pct:100,say:m.try});
    document.getElementById('go').onclick=()=>{gAward(3);finish();};document.getElementById('no').onclick=finish;
  }else finish();
}
function nextLabel(){if(S.sess.n>=S.cfg.per)return'Seguir';if(S.sess.since>=S.cfg.brk)return'Toca moverse';return M.some((_,k)=>!S.done[k])?'Siguiente misión':'Seguir';}
function route(){
  clearAll();
  if(S.sess.n>=S.cfg.per)return stopToday();
  if(S.sess.since>=S.cfg.brk){S.sess.since=0;save();return move(nextOrHome);}
  nextOrHome();
}
function nextOrHome(){const E=window.EX&&S.best==null?window.EX:M.length;const i=M.findIndex((_,k)=>k<E&&!S.done[k]);if(i>=0)lesson(i);else home();}
function afterReview(){
  clearAll();gAward(3,60);const banner=gBanner();
  shell(`<h1>Repaso hecho</h1>${banner}<p class="small">${wrongIds().length?`Quedan ${wrongIds().length} para otro rato.`:'No queda ninguna pendiente.'}</p><button class="go" id="go">Seguir</button>`,{exit:false});
  document.getElementById('go').onclick=home;document.getElementById('go').focus({preventScroll:true});
}

/* ===== Pausa de movimiento ===== */
function move(next,head){
  clearAll();const [ic,tx]=pick(MOVES);let t=BREAK_SECS;
  shell(`${head||''}<h2 style="text-align:center">Toca moverse</h2><div class="move">${ic}</div><p style="text-align:center;font-size:25px;font-weight:500">${tx}</p><div class="count" id="c">${t}</div><button class="go" id="go" disabled>Seguir</button>`,{exit:true,say:tx});
  const tick=()=>{t--;const c=document.getElementById('c');if(!c)return;c.textContent=Math.max(t,0);if(t<=0){const g=document.getElementById('go');g.disabled=false;g.focus({preventScroll:true});ding(true);keyH=e=>{if(e.key==='Enter'){e.preventDefault();next();}};}else later(tick,1000);};
  document.getElementById('go').onclick=()=>next();
  if(t<=0){t=1;}later(tick,1000);
}
function stopToday(){
  clearAll();
  shell(`<div class="move">🏁</div><h1 style="text-align:center">Por ahora, terminado</h1><p style="text-align:center">Tu cerebro necesita un descanso largo para guardar lo aprendido. Ya puedes cerrar esto.</p>${dots()}<button class="alt" id="more">Quiero seguir un poco más</button>`,{exit:false});
  document.getElementById('more').onclick=()=>{S.sess.n=0;S.sess.since=0;S.sess.ts=Date.now();save();move(home);};
}

/* ===== Simulacro ===== */
function simIntro(){
  clearAll();
  shell(`<h2>Simulacro: 30 preguntas</h2>
   <div class="fact"><span class="ic">👀</span><span><b>Lee toda</b> la pregunta.</span></div>
   <div class="fact"><span class="ic">❌</span><span><b>Descarta</b> la que seguro que no es.</span></div>
   <div class="fact"><span class="ic">✅</span><span><b>Marca</b> y sigue. Sin prisa.</span></div>
   <p class="small">Pausa a las 10 preguntas.</p><button class="go" id="go">Empezar</button>`);
  const go=()=>{R={kind:'sim',ids:(()=>{const s=shuffle(OFFICIAL.map(x=>String(x.id)));return Array.from({length:30},(_,i)=>s[i%s.length]);})(),pos:0,ok:0,bok:0,miss:[]};simQ();};
  document.getElementById('go').onclick=go;document.getElementById('go').focus({preventScroll:true});
}
function simQ(){
  clearAll();
  if(R.pos>=R.ids.length)return simEnd();
  const t0=Date.now(),q=pickVar(byId[R.ids[R.pos]]),opts=gOrden(q.a,q.w,R.ids[R.pos]);window.CURQ=q;
  shell(`<div class="tag">Pregunta ${R.pos+1} de 30</div><div class="q">${fmt(q.q)}</div><div class="opts" id="opts"></div><div id="fb"></div>`,{pct:R.pos/30*100,say:q.say||(q.q+' '+opts.map((o,i)=>`${i+1}: ${o}`).join('. '))});gOye(q);
  let done=false;
  const answer=k=>{if(done)return;done=true;
    gNota(opts[k]===q.a);if(opts[k]===q.a){R.ok++;R.bok++;delete S.wrong[q.id];gCorrect(q.id);}else{R.miss.push(String(q.id));R.mq=R.mq||{};R.mq[q.id]=q;S.wrong[q.id]=true;}
    save();document.querySelectorAll('.opt').forEach((b,x)=>{b.disabled=true;if(x===k){b.style.borderColor='var(--main)';b.style.background='var(--tint)';}else b.classList.add('fade');});
    const nx=gSig(document.getElementById('fb'),t0,()=>{R.pos++;
    if(R.pos<R.ids.length&&R.pos%10===0){const n=R.bok;R.bok=0;move(simQ,`<p style="text-align:center;font-size:24px;font-weight:700">${n} de 10 en este trozo</p>`);}
    else simQ();});keyH=e=>{if(e.key==='Enter'){e.preventDefault();nx();}};};
  later(()=>{document.getElementById('opts').innerHTML=opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="n">${i+1}</span><span>${gF(o)}</span></button>`).join('');
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
    keyH=e=>{const n=+e.key;if(n>=1&&n<=opts.length){e.preventDefault();answer(n-1);}};},OPT_DELAY);
}
function simEnd(){
  clearAll();gSim(R.ok);gAward(15,60);const banner=gBanner();const ok=R.ok;const prev=S.best;if(prev===null||ok>prev){S.best=ok;save();}
  const msg=prev!==null&&ok>prev?`Has mejorado: antes, ${prev}.`:ok>=27?'Lo tienes muy bien.':ok>=18?'Vas bien. Repasa lo que ha fallado.':'Terminar el simulacro ya es un logro. Ahora toca repasar.';
  const list=R.miss.map(id=>{const q=R.mq[id];return `<p style="margin:0 0 10px"><span class="small">${fmt(q.q)}</span><br><b style="color:var(--ok)">${gF(q.a)}</b></p>`;}).join('');
  shell(`<div class="big">${ok} de 30</div><p>${msg}</p>${banner}
    ${R.miss.length?'<button class="go" id="rp">Repasar 5 fallos</button>':''}<button class="alt" id="hm">Volver al inicio</button>
    ${list?`<h3>Las respuestas de las que has fallado</h3>${list}`:''}`,{exit:false});
  document.getElementById('hm').onclick=home;
  const r=document.getElementById('rp');if(r)r.onclick=startReview;
}

/* ===== Páginas de apoyo ===== */
function map(){

function escribir(modo){
  clearAll();

  else if(modo==='verb')items=sh(HAB.flatMap(([t,f])=>f.map((x,p)=>({q:`HABLAR · <b>${PERS[p]}</b> · ${t.toLowerCase()}`,ok:x.split(' / ').map(y=>y.trim()).concat([x]),a:x})))).slice(0,10);
  else if(modo==='til')items=sh(TIL).slice(0,10).map(([s,c])=>({q:`Escríbela bien (con tilde si la lleva): <b>${s}</b>`,ok:[c],a:c,exact:true}));
  else if(modo==='sil')items=sh(SIL).slice(0,8).map(([w,s])=>({q:`Separa en sílabas con guiones: <b>${w}</b>`,ok:[s],a:s,exact:true}));
  else if(modo==='sep')items=sh(SEP).slice(0,8).map(([w,o])=>({q:`Separa lexema y morfemas con guiones: <b>${w}</b>`,ok:o,a:o[0]}));
  else if(modo==='hip')items=sh(HIP).slice(0,8).map(([w,o])=>({q:`Escribe el hiperónimo de: <b>${w}</b>`,ok:o,a:o[0]}));
  else items=sh(VOC).slice(0,10).map(v=>({q:`¿Qué palabra significa: «${v[1]}»?`,ok:[v[0],v[0]==='albores'?'albor':v[0]],a:v[0]}));
  let i=0,bien=0;const malos=[];
  const fin=()=>{const tot=items.length;if(bien)gAward(Math.max(1,Math.round(bien/2)),30);
    shell(`<div class="page"><h2>${bien===tot?'🏆 ¡Todo bien!':bien>=tot/2?'👍 Bien':'💪 A repasar'}</h2><p class="small">Bien: <b>${bien} de ${tot}</b></p>
     ${malos.length?`<h3>Repasa</h3><table>${malos.map(m=>`<tr><td>${m.q}</td><td><b>${m.a}</b></td></tr>`).join('')}</table>`:''}
     <button class="go" id="re">Otra ronda</button><button class="alt" id="mn">Otros ejercicios</button></div>`);
    document.getElementById('re').onclick=()=>escribir(modo);document.getElementById('mn').onclick=escribirMenu;};
  const paso=()=>{

    shell(`<p class="small">${i+1} de ${items.length}</p><div class="q">${fmt(it.q).replace(/&lt;(\/?b)&gt;/g,'<$1>')}</div>
     ${it.self?'<textarea id="ans" class="esc" rows="4" placeholder="Escribe aquí tu respuesta…"></textarea>':'<input id="ans" class="esc" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe aquí…">'}
     <button class="go" id="ok">${it.self?'Ver la respuesta':'Comprobar'}</button><div id="fb"></div>`,{pct:Math.round(i/items.length*100)});
    const inp=document.getElementById('ans');inp.focus();

      if(it.self){document.getElementById('ok').remove();
        document.getElementById('fb').innerHTML=`<div class="fb ok modelo"><strong>Respuesta modelo:</strong> ${it.a}</div><p class="small">¿Qué tal te salió?</p><div class="autoev"><button class="go" id="sb">✅ Bien</button><button class="alt" id="sr">🤏 A medias</button><button class="alt" id="sm">❌ Mal</button></div>`;
        document.getElementById('sb').onclick=()=>{bien++;gNota(true);sig();};
