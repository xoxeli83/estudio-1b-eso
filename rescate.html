function pickVar(base){
  const vs=VAR[String(base.id)];
  if(!vs||!vs.length)return base;
  const i=Math.floor(Math.random()*(vs.length+1));
  if(i===vs.length)return base;
  const c=vs[i];
  return {id:base.id,b:base.b,c:base.c,n:base.n,q:c[0],a:c[1],w:c.slice(2)};
}

function gAward(n,time){

 const cerca=(wx,wy)=>{let best=null,bd=1e9;S.cr.forEach(c=>{if(['dead','saved','gone','dying','splat'].includes(c.st))return;const dx=c.x-wx,dy=(c.y-9)-wy,dd=dx*dx+dy*dy;const pen=S.sel&&!['climb','float','bomb'].includes(S.sel)&&c.st!=='walk'?400:0;if(dd+pen<bd){bd=dd+pen;best=c;}});const lim=Math.max(16,22/S.sc*.6);return bd<=lim*lim+400?best:null;};
 let drag=null;
 cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,cam:S.cam,camY:S.camY||0,mv:false};
  if(S.mini){const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,[mx,my,mw,mh]=S.mini;if(px>=mx&&px<=mx+mw&&py>=my&&py<=my+mh){S.cam=(px-mx)/mw*W-S.vw/2;drag.mini=true;}}});
 cv.addEventListener('pointermove',e=>{if(drag){if(drag.mini){const r=cv.getBoundingClientRect(),[mx,,mw]=S.mini;S.cam=(e.clientX-r.left-mx)/mw*W-S.vw/2;return;}const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)>8||Math.abs(dy)>8)drag.mv=true;if(drag.mv){S.cam=drag.cam-dx/S.sc;S.camY=drag.camY-dy/S.sc;}}
  else if(e.pointerType==='mouse'){const [wx,wy]=aMundo(e);S.hover=cerca(wx,wy);}});
 cv.addEventListener('pointerup',e=>{const dr=drag;drag=null;if(!dr||dr.mv||dr.mini||S.fin)return;const [wx,wy]=aMundo(e);const c=cerca(wx,wy);if(c&&S.sel){if(!asigna(c,S.sel)){if(!S.sk[S.sel])SND.sfx('bloqueo',.3);}}});
 cv.addEventListener('wheel',e=>{e.preventDefault();S.cam+=(e.deltaX||e.deltaY)/S.sc;},{passive:false});
 document.onkeydown=e=>{if(!S)return;const ks=SKO.filter(k=>S.L.sk[k]!==undefined);const n=+e.key;if(n>=1&&n<=ks.length){S.sel=ks[n-1];upd();}
  if(e.key==='p'||e.key==='P'||e.key===' '){e.preventDefault();$('#rs-p').click();}if(e.key==='f'||e.key==='F')$('#rs-f').click();if(e.key==='z'||e.key==='Z')$('#rs-z').click();if(e.key==='ArrowUp')S.camY=(S.camY||0)-60;if(e.key==='ArrowDown')S.camY=(S.camY||0)+60;
  if(e.key==='ArrowLeft')S.cam-=60;if(e.key==='ArrowRight')S.cam+=60;};
 upd();acc=0;last=0;raf=requestAnimationFrame(loop);
 // aviso inicial
 S.pause=true;const m=document.createElement('div');m.id='rs-msg';
 m.innerHTML=`<h2>${li+1}. ${S.L.n}</h2><p>Salen <b>${S.L.N}</b> gominos. Tienes que salvar al menos el <b>${S.L.need}%</b>.</p><p>💡 ${S.L.tip}</p><p style="font-size:14px;opacity:.8">${Object.keys(S.L.sk).map(k=>SK[k].i+' '+SK[k].n+' ×'+S.L.sk[k]).join(' · ')}</p><button class="rs-sm" id="rs-go">¡Vamos!</button>`;
 d.appendChild(m);$('#rs-go').onclick=()=>{m.remove();S.pause=false;SND.sfx('ya',.6);SND.musica();};}
/* ---------- Menú ---------- */
function heroCanvas(){const c=document.createElement('canvas');c.width=300;c.height=220;const x=c.getContext('2d');x.scale(4,4);[[12,52,18],[28,52,195],[44,52,330],[60,52,45]].forEach(([px,py,h],i)=>{x.save();x.translate(px,py);dibGomino(x,{hue:h,d:i%2?-1:1,st:'walk',f:i*7,t:0,climb:false,float:false,bomb:-1});x.restore();});return c;}
function menu(){document.body.classList.add('rs-dark');const g=gLoad(),pr=prog();if(TEST)g.prueba=true;
 const fin=sesFin(),quedan=Math.max(0,fin-Date.now());
 const espera=()=>{const m=Math.max(1,Math.ceil(((g.fBloq>Date.now()?g.fBloq:g.fichaT+G_FPASO)-Date.now())/60000));return m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`;};
 if(!TEST&&ligaOn()&&!g.liga){app.innerHTML=`<div class="rs-box"><div class="rs-hero"><h1>Rescate Gomino</h1><p>Guía a los gominos hasta la salida.</p></div><div class="rs-gift"><b>Para jugar tienes que entrar con tu correo.</b><br>Tu padre o tu madre te da de alta desde su cuenta. Para estudiar no hace falta.</div><a class="rs-go" href="acceso.html?volver=rescate.html">Entrar con mi correo</a></div>`;return;}
 const hay=g.prueba||quedan>0;const abierto=i=>TEST||i===0||(pr.best[i-1]||0)>=LV[i-1].need;
 app.innerHTML=`<div class="rs-box"><div class="rs-hero"><h1>Rescate Gomino</h1><p>Los gominos caminan sin parar. Dales habilidades para que lleguen a casa sanos y salvos.</p></div>
 ${TEST?'<div class="rs-gift">🧪 <b>Versión de prueba.</b> Todos los niveles abiertos y sin fichas. En la web de verdad, 1 ficha = '+SES_MIN+' minutos.</div>':g.prueba?'<div class="rs-gift">🧪 <b>Modo de pruebas.</b> Tiempo de juego sin límite.</div>':''}
 <div class="rs-me">${avatarSVG(g.av,56)}<div><b>${hay&&!g.prueba?`⏱ Te quedan ${Math.ceil(quedan/60000)} min de juego`:`🎮 ${g.fichas} de 3 fichas`}</b><br><small>${hay?'Elige un nivel.':g.fichas>0?'1 ficha = '+SES_MIN+' minutos para jugar a los niveles que quieras.':`Podrás jugar dentro de ${espera()}.`}</small></div></div>
 ${hay?'':g.fichas>0?`<button class="rs-go" id="rs-start">Empezar (1 ficha = ${SES_MIN} min)</button>`:`<div class="rs-gift">Te has quedado sin fichas. Podrás volver a jugar dentro de ${espera()}. Terminando misiones consigues más.</div><a class="rs-go" href="index.html">Ir a estudiar</a>`}
 <h2>Niveles</h2><div class="rs-lv">${LV.map((l,i)=>{const ok=abierto(i),b=pr.best[i]||0,th=TH[l.t];return`<button class="rs-l ${ok?'':'lock'}" data-l="${i}" ${ok&&hay?'':'disabled'} style="background:linear-gradient(160deg,${th.sky[2]},${th.sky[1]} 55%,${th.sky[0]})"><span class="n">Nivel ${i+1}</span>${b>=l.need?'<span class="ok">⭐</span>':''}<b>${ok?l.n:'🔒'}</b><small>${ok?(b?'Mejor: '+b+'%':'Salva el '+l.need+'%'):'Supera el anterior'}</small></button>`;}).join('')}</div>
 <h2>Habilidades</h2><div class="rs-help">${SKO.map(k=>`${SK[k].i} <b>${SK[k].n}</b>: ${SK[k].d}`).join('<br>')}<br><br>Elige una habilidad abajo y toca a un gomino. Arrastra para mover la vista. Con ➖ ➕ cambias lo rápido que salen. 💥 (dos toques) hace explotar a todos.</div>
 ${TEST?'':'<p><a class="rs-link" href="juego.html">← Volver a la zona de juego</a></p>'}</div>`;
 const hc=$('.rs-hero');if(hc)hc.appendChild(heroCanvas());
 document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const fin=sesFin();if(!TEST&&!gLoad().prueba&&fin<Date.now())return menu();jugar(+b.dataset.l);});
 const go=$('#rs-start');if(go)go.onclick=async()=>{go.disabled=true;let okF=false;try{okF=await gGastar();}catch(e){go.disabled=false;go.textContent='Sin conexión. Inténtalo otra vez';return;}if(!okF)return menu();sesPon(Date.now()+SES_MIN*60000);menu();};
 if(hay&&!g.prueba)setTimeout(()=>{if($('.rs-box')&&sesFin()<Date.now())menu();},quedan+500);}
menu();if(!TEST)gSync().then(x=>{if(x&&$('.rs-box'))menu();}).catch(()=>{});
window.__R={LV,jugar,get S(){return S;},asigna,tick:()=>tick(),menu,sesPon};
})();
