<style>
:root{--ink:#17203a;--soft:#57617a;--main:#3a3ca6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:16px;font-family:Lexend,Verdana,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#1b56b8,#4f93dc)}
#app{max-width:980px;margin:0 auto}
h1{color:#fff;font-size:38px;line-height:1.1;margin:14px 4px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{display:block;width:100%;padding:0;border:0;border-radius:18px;overflow:hidden;background:#fff;font:inherit;color:inherit;text-align:left;cursor:pointer;box-shadow:0 6px 0 rgba(10,30,90,.35);transition:transform .12s}
.card:hover{transform:translateY(-3px) rotate(-.6deg)}
.card:focus-visible,a:focus-visible,button:focus-visible{outline:4px solid #ff8a00;outline-offset:2px}
.card svg{display:block;width:100%;height:auto}
.card b{display:block;padding:11px 14px 2px;font-size:20px;line-height:1.2}
.card span{display:block;padding:0 14px 13px;font-size:15px;color:var(--soft)}
.card span.on{color:#17783f;font-weight:500}
.sub{max-width:620px;margin:12px auto 0;background:#fff;border-radius:18px;overflow:hidden}
.sub svg{display:block;width:100%;height:auto}
.in{padding:18px 20px 22px}
.in h2{font-size:30px;line-height:1.15;margin:0 0 12px}
.tema{display:block;border:3px solid #c6d0e0;border-radius:12px;padding:15px;font-size:21px;font-weight:500;color:var(--ink);text-decoration:none}
.tema:hover{border-color:var(--main)}
.top{display:flex;flex-wrap:wrap;gap:8px;margin:0 2px 16px}.top a{background:#fff;color:var(--ink);font-weight:500;text-decoration:none;border-radius:12px;padding:11px 15px;font-size:17px;box-shadow:0 4px 0 rgba(10,30,90,.35)}.card span.pr{margin-top:-8px;font-size:14px;color:var(--main)}.prem{color:var(--soft);margin:0 0 12px}
.back{display:inline-block;background:none;border:0;color:#fff;font:inherit;font-size:18px;text-decoration:underline;padding:8px 4px;cursor:pointer}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}h1{font-size:30px}.card b{font-size:17px;padding:9px 10px 2px}.card span{padding:0 10px 10px;font-size:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const app=document.getElementById('app');
const esc=s=>s.replace(/&/g,'&amp;');
function list(){
  document.title='Estudio 1º B ESO';
  app.innerHTML=`<h1>Estudio 1º B ESO</h1><nav class="top"><a href="juego.html">🎮 Jugar</a><a href="juego.html#clasificacion">🏆 Clasificación</a><a href="juego.html#muneco">🧑 Mi muñeco</a><a href="calendario.html">📅 Calendario</a><a href="acceso.html">👪 Padres y acceso</a><a href="guia-familias.html">📖 Guía para familias</a><a href="como-funciona.html">ℹ️ Cómo funciona</a></nav><div class="grid">${AS.map(a=>{const n=(a.temas||[]).length;
    return `<button class="card" data-id="${a.id}">${a.a}<b>${esc(a.n)}</b><span class="${n?'on':''}">${n?n+(n===1?' tema':' temas'):'Próximamente'}</span><span class="pr">${a.premio}</span></button>`;}).join('')}</div>`;
  app.querySelectorAll('.card').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id;});
  window.scrollTo(0,0);
}
function subject(a){
  document.title=a.n+': Estudio 1º B ESO';
  const t=(a.temas||[]).map(([n,h])=>`<a class="tema" href="${h}">${esc(n)}</a>`).join('');
  app.innerHTML=`<button class="back" id="b">Volver a las asignaturas</button><section class="sub">${a.a}<div class="in"><h2>${esc(a.n)}</h2><p class="prem">Premio de esta asignatura: ${a.premio}</p>${t||'<p>Todavía no hay temas de esta asignatura.</p>'}</div></section>`;
  document.getElementById('b').onclick=()=>{location.hash='';};
  window.scrollTo(0,0);
}
function route(){const a=AS.find(x=>x.id===location.hash.slice(1));a?subject(a):list();}
addEventListener('hashchange',route);route();
